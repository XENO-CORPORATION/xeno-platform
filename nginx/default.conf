server {
    listen 80;
    server_name localhost;

    # Re-resolve Docker service names so backend container IP changes do not
    # strand nginx on a stale upstream after backend restarts/recreates.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $backend_upstream backend:8080;
    # Deferred (runtime) resolution for the optional KasmVNC browser container, so
    # nginx still starts when xeno-browser is not deployed/running. Using a variable
    # in proxy_pass below means nginx resolves it per-request (502 if down) instead of
    # aborting at startup with "host not found in upstream".
    set $xeno_browser_upstream xeno-browser:6901;

    # ==========================================================================
    # SECURITY SETTINGS
    # ==========================================================================

    # Block access to hidden files (.env, .git, .htaccess, etc.) — but NEVER
    # /.well-known/* (RFC 8615): it carries OIDC discovery
    # (/api/oauth2/.well-known/openid-configuration) and ACME challenges. The
    # negative lookahead lets those through to the proxy while still denying
    # real dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common attack vectors and scanners
    location ~* ^/(admin|wp-admin|wp-login\.php|wp-content|wordpress|phpmyadmin|\.git|\.svn|\.env|\.htaccess|config\.php|xmlrpc\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Executables & scripts must never fall through to the SPA ───────────────
    # The `location /` catch-all at the bottom answers ANY unmatched path with
    # index.html (200, text/html). For a page route that is correct; for a
    # script it is dangerous. /install.sh and /install.ps1 returned 200 with
    # 4,311 bytes of homepage HTML, and the agent-cli docs used to tell people to
    # run `curl -fsSL https://xenostudio.ai/install.sh | sh` — piping a web page
    # into a shell. The docs were fixed; the ROUTE still answered 200, so anyone
    # replaying that line from shell history kept hitting it. Same defect class
    # as the download gate (4283c0d): a route answering 200 for something that
    # does not exist.
    #
    # `try_files $uri =404` still serves a real file if we ever publish one, and
    # 404s otherwise — it removes the SPA fallback, not the ability to host a
    # script. Regex locations beat the `location /` prefix match regardless of
    # order, so this wins the catch-all; `^~ /vnc/` and `^~ /websockify` keep
    # their priority over it. The (?!/api/) guard keeps the backend proxy
    # reachable if an endpoint ever ends in one of these.
    #
    # NOTE — deliberately NO add_header here. In nginx, add_header is inherited
    # from the enclosing level ONLY while the current level declares none of its
    # own; adding a single header here would silently drop all eight
    # server-level security headers from these responses.
    # ".com" is deliberately NOT in this list — it would also match any path
    # ending in a hostname. Access logging stays ON: how much traffic still
    # replays the old curl one-liner is worth being able to see.
    # The ONE script path the site answers: XENO Spawn's one-command install (irm https://xenosystem.ai/install/spawn.ps1 | iex).
    # An exact match outranks the script-block regex below, and it only ever redirects: the script itself lives on R2
    # (apps/spawn/install.ps1, published by xeno-spawn through the gated publisher), never on this box.
    # No add_header here, for the same inheritance reason as the block below.
    location = /install/spawn.ps1 {
        return 302 https://updates.xenostudio.ai/apps/spawn/install.ps1;
    }

    location ~* ^(?!/api/).*\.(sh|bash|zsh|fish|ps1|psm1|bat|cmd|vbs|wsf|exe|msi|scr|dll|apk|dmg|pkg|deb|rpm|appimage|jar|py|rb|pl|php)$ {
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;

    # ── DE-INDEX (2026-08-11) ────────────────────────────────────────────────
    # The site is not meant to be publicly discoverable yet.
    #
    # This header — NOT a robots.txt `Disallow: /` — is what actually removes
    # pages from Google. `Disallow` blocks CRAWLING, which means Googlebot can
    # never fetch the page again and therefore never sees a noindex; already
    # indexed URLs then persist as bare links. robots.txt deliberately still
    # ALLOWS crawling so this header can be read and obeyed.
    #
    # Repeated in every `location` that declares its own add_header (see the
    # inheritance note above at the shell-extension block): a child level that
    # sets ANY header drops ALL inherited ones, so a single server-level
    # declaration would silently vanish exactly where assets are served.
    #
    # TO REVERSE: delete this line and the three copies below, rebuild, deploy,
    # then re-submit the sitemap in Search Console.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Hide server version
    server_tokens off;

    # ==========================================================================
    # UPLOAD & TIMEOUT SETTINGS
    # ==========================================================================

    # Large file upload support
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_body_timeout 600s;
    send_timeout 600s;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # The SPA fallback must not turn the deliberately-disabled sitemap into a
    # successful HTML response. Crawlers treat a 200 /sitemap.xml as a sitemap
    # fetch even when the body is index.html; fail with the true route state.
    location = /sitemap.xml {
        return 404;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # MCP sign-in discovery for XENO Tasks: RFC 9728 protected-resource metadata and RFC 8414
    # authorization-server metadata live at the site root by spec, so they go to the backend.
    location ^~ /.well-known/oauth- {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # REST only. Connection: upgrade on every /api/ request is a latent
        # 502: nginx copied the websocket hop-by-hop header onto ordinary
        # POSTs (chat, tokenize, piston). Websockets live at /ws.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connect is "is the process listening?", not upload time.
        # 600s here held a refused backend for ten minutes after a crash.
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Large body support
        client_max_body_size 500M;
    }

    # XENO Extension browser relay — the ONE websocket under /api/.
    #
    # 🔴 `/api/` above deliberately refuses Connection: upgrade, because copying that hop-by-hop header
    # onto ordinary POSTs produced a latent 502 on chat/tokenize/piston. That refusal is correct and
    # stays; the relay therefore needs its own block, and this is it. Without this exact-path block the
    # handshake never upgrades, the extension sees a 200 with no socket, and the failure presents as
    # "the browser is not connected" — a browser that is connected. 2026-10-17.
    #
    # ^~ so this prefix wins over `location /api/`: nginx otherwise prefers a regex match, and a future
    # regex rule would silently take the relay's upgrades away. `location /ws` above keeps its own
    # separate prefix, so no existing connection changes behaviour.
    location ^~ /api/v2/browser/connect {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A browser connection is long-lived and mostly idle between steps; it is kept warm by the
        # server's own ping. These match the collaboration socket's timeouts on purpose — two websocket
        # routes with different idle rules is how one of them starts dropping for no visible reason.
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # WebSocket proxy for collaboration
    # Realtime collaboration (office canvas, OS desktop session). This route was refused from 2026-10-08
    # until the backend release at 909dae1 removed the handler that ran file operations on any path a
    # client sent. scripts/ws-file-operation.test.mjs keeps that handler from coming back.
    location /ws {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time
        proxy_buffering off;
    }
    
    # env-config.js is DYNAMIC runtime config (NOT content-hashed) — it must NEVER be
    # cached by browsers or the CDN. The generic 1-year `immutable` rule below once
    # pinned a secret-bearing build of this file in Cloudflare for its whole TTL
    # (the env-config key-leak incident). Exact-match `location =` wins over the regex
    # rule regardless of order, so this is the authoritative caching policy for it.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
    }

    # Static files with cache (content-hashed build assets only — safe to pin 1y).
    # Media and fonts are here too: with the site gate on, anything NOT listed falls into `location /` and gets
    # "Coming soon" HTML where a video/font should be (found 2026-10-18, /robots.txt and /hero-bg.mp4 both did).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot|mp4|webm|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declared, and it matters most here: images are indexed by Google
        # Images independently of the page that embeds them, so without this the
        # screenshots and product art stay discoverable after the pages go.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # robots.txt is a crawler contract, not a page: it must answer as itself while the gate is on (the de-indexing
    # is the X-Robots-Tag header, never `Disallow: /` — see the header block above), and it must not be pinned for a
    # year like a hashed asset. /sitemap.xml is handled above and stays a true 404.
    location = /robots.txt {
        expires -1;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    
    # Unified auth: the CLI/Hub browser-session page moved onto the branded
    # /auth/cli surface. Deployed CLIs still open /cli-auth?session=… — 308 it
    # (preserving the query) so they keep working. /cli-auth/device (code-entry)
    # stays on its own page for now (exact-match here doesn't touch sub-paths).
    location = /cli-auth {
        return 308 /auth/cli$is_args$args;
    }
    location = /cli-auth/device {
        return 308 /auth/cli/device$is_args$args;
    }

    # Stable product download deep-links (PRODUCT-PAGES-SPEC.md §4). ONLY the
    # OS-specific subpath /product/<slug>/download/<os>[/<version>] is proxied to
    # the backend, which 302s to the current installer on R2. The product page
    # (/product/<slug>) and the bare download page (/product/<slug>/download)
    # have no trailing OS segment, so they fall through to the SPA below.
    location ~ ^/product/[^/]+/download/[^/]+ {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # XENO Storage sign-in folder link — /storage/shared/<token>[/f/<folder id>|/files/<file id>], served by the
    # backend (routes/storageSharedRoutes.js), never by the SPA. Deliberately OUTSIDE the site gate: the person a link
    # is for (an investor) holds neither the access code nor an allowlisted account. Safe because the backend shows
    # nothing without a live link AND a signed-in, active account it has admitted (viewer tuples); signed out it
    # names nothing but "a folder". No add_header here, so the server-level X-Robots-Tag noindex is inherited, and
    # the backend sets it again. The token is exactly 43 base64url characters; anything else falls to the SPA.
    location ~ "^/storage/shared/[A-Za-z0-9_-]{43}(/.*)?$" {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_max_temp_file_size 0;
    }

    # XENO Artifacts viewer — /a/<id> and the raw revision files beneath it are
    # served by the backend (routes/artifactViewerRoutes.js), never by the SPA:
    # the shell needs the session cookie resolved server-side and the raw files
    # need the artifact CSP + sandbox headers. The id is a_ + 22 [A-Za-z0-9], so
    # every other /a/… path (nothing today) still falls through to the SPA.
    # In production the RAW files answer only on the user-content host (the
    # server block at the end of this file); the backend enforces that by Host.
    location ~ "^/a/a_[A-Za-z0-9]{22}(/.*)?$" {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Revision files can be up to 16 MB; do not buffer them through a tiny temp file.
        proxy_max_temp_file_size 0;
    }

    # ── Legacy product-page redirects → canonical singular /product/* ──────────
    # PRODUCT-PAGES-SPEC.md §10. The old plural /products/<slug>/* static pages and
    # the legacy /download + /releases/* routes 301 to the canonical URLs.
    # $is_args$args preserves any query string. The bare /products index is NOT
    # matched here (regex requires a slug segment), so it falls through below.
    location ~ ^/products/([^/]+)/release-notes/([^/]+)/?$ { return 301 /product/$1/releases/$2$is_args$args; }
    location ~ ^/products/([^/]+)/release-notes/?$         { return 301 /product/$1/releases$is_args$args; }
    location ~ ^/products/([^/]+)/download/?$              { return 301 /product/$1/download$is_args$args; }
    location ~ ^/products/([^/]+)/docs(/.*)?$              { return 301 /product/$1/docs$is_args$args; }
    location ~ ^/products/([^/]+)/?$                       { return 301 /product/$1$is_args$args; }
    location = /download                                   { return 301 /product/hub/download$is_args$args; }
    location ~ ^/releases/([^/]+)/?$                       { return 301 /product/hub/releases/$1$is_args$args; }

    # Relative redirects so 301/308 keep the request's scheme (https behind the proxy)
    # instead of emitting http://.
    absolute_redirect off;

    # The XENO workspace is static files under /workspace/. Its scripts load by relative path, so the
    # address must end in a slash; without it the browser would ask for /keys.js and get the app shell.
    location = /workspace { return 301 /workspace/$is_args$args; }

    # Its file names carry no content hash, so the one-year `immutable` rule above must never apply:
    # a returning visitor would keep an old script for a year. `^~` stops the regex rules from matching.
    # `no-cache` still lets the browser keep a copy, but it revalidates on every load.
    # A missing file is a 404, never the app shell, so a wrong script name fails loudly.
    location ^~ /workspace/ {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        # An app address has no file extension (/workspace/studio/tasks/T-4): it is the workspace page itself, so
        # refresh and shared links open the right place. Anything with an extension is a file: missing means 404.
        location ~ ^/workspace/[^.]*$ {
            try_files /workspace/index.html =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        }
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Product icons the workspace shows. Their names carry no content hash, so they must not get the
    # one-year `immutable` rule above: a redrawn icon would not reach returning visitors. One day instead.
    location ^~ /product-icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # The old /overview app is retired: the XENO workspace (/workspace/...) is the signed-in app. Every old
    # address that has a new home moves there PERMANENTLY (301), query kept, so bookmarks, shared links and
    # sign-in return URLs keep working ("cool URIs don't change"). Pages still waiting to move into the
    # workspace (studio, office, tools, content creation, search, generation, labs) are not listed here and
    # keep their old address until they move.
    location = /overview { return 301 /workspace$is_args$args; }
    location = /overview/ { return 301 /workspace$is_args$args; }
    location = /overview/welcome { return 301 /workspace$is_args$args; }
    location ~ ^/overview/(?:c|chat/llm|chat/c)/([A-Za-z0-9_.:-]+)/?$ { return 301 /workspace/apps/chat/$1$is_args$args; }
    location ~ ^/overview/chat/projects/[^/]+/c/([A-Za-z0-9_.:-]+)/?$ { return 301 /workspace/apps/chat/$1$is_args$args; }
    location ~ ^/overview/chat(?:/llm|/c|/multi)?/?$ { return 301 /workspace/apps/chat$is_args$args; }
    location ~ ^/overview/chat/shared/([A-Za-z0-9_.-]+)/?$ { return 301 /share/$1$is_args$args; }
    location ~ ^/overview/(?:chat/)?projects(?:/.*)?$ { return 301 /workspace/projects$is_args$args; }
    location ~ ^/overview/(?:chat/)?(?:library|artifacts)(?:/.*)?$ { return 301 /workspace/library$is_args$args; }
    location ~ ^/overview/(?:chat/)?(scheduled|customize|skills|settings)/?$ { return 301 /chat/$1$is_args$args; }
    location = /overview/profile { return 301 /workspace/settings/profile$is_args$args; }
    location = /overview/settings { return 301 /workspace/settings/security$is_args$args; }
    location = /overview/billing { return 301 /workspace/settings/plan$is_args$args; }
    location = /overview/subscription { return 301 /workspace/settings/plan$is_args$args; }
    location = /overview/usage-analytics { return 301 /workspace/settings/usage$is_args$args; }
    location = /overview/ai-keys { return 301 /workspace/settings/providers$is_args$args; }
    location = /overview/notifications { return 301 /workspace/settings/notifications$is_args$args; }
    location = /overview/integrations { return 301 /workspace/settings/connections$is_args$args; }
    location ~ ^/overview/teams?(?:/.*)?$ { return 301 /workspace/settings/workspace$is_args$args; }
    location = /overview/help { return 301 /support$is_args$args; }

    # React Router — serve index.html for all routes. Trying $uri/index.html BEFORE
    # $uri/ serves the prerendered product pages directly (200) without nginx's
    # directory trailing-slash 301.
    # THE SITE GATE (owner, 2026-10-18). Every page asks the backend first; with SITE_GATE=on only people with access
    # (routes/siteGateRoutes.js) see it, everyone else gets /coming-soon.html. With it off the check always answers yes.
    # Not gated, on purpose: /api/ (installed apps, OAuth), static assets, /install/spawn.ps1, and the sign-in and legal
    # pages below (a person must be able to sign in, and Stripe/app-store reviews read the legal pages).
    location = /__site_gate {
        internal;
        proxy_pass http://$backend_upstream/api/site-gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /coming-soon.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    # Sign-in and legal pages stay reachable while the gate is on (SPA routes; the bundle they need is a static asset).
    #
    # 🔴 The fallback is a NAMED location, never `/index.html`. `try_files … /index.html` is an internal redirect, which
    # re-runs location matching: `/index.html` falls into `location /` above and gets gated. `/login` has no file of its
    # own, so on 2026-10-18 that served "Coming soon" on the sign-in page itself and locked every person out — nobody
    # could sign in, which is the one way back into a gated site. A named location is jumped to directly and has no
    # `auth_request`, so the bypass stays a bypass. `scripts/site-gate.test.mjs` pins this.
    location ~ ^/(account/connected|login|signup|forgot-password|reset-password|verify-email|auth|activate|onboarding|privacy|terms|cookies|impressum|refunds|withdrawal|widerruf|support|contact|security)(/|$) {
        try_files $uri $uri/index.html @spa_shell;
    }
    location ~ ^/product/[^/]+/privacy/?$ {
        try_files $uri $uri/index.html @spa_shell;
    }
    location @spa_shell {
        try_files /index.html =404;
    }

    # The shareable access-code entry (owner, 2026-10-22): /access lands on
    # the homepage address with the gate's code form opened. For a visitor
    # without access, / is the Coming soon page (its script opens the form
    # on ?access=1); with access it is simply the homepage. A code can ride
    # the link itself (/?code=XXXX) and unlocks on arrival - the check is
    # the same POST /api/site-gate/unlock as typing it, no second door.
    location = /access { return 302 /?access=1; }

    # Product pages: the owner's XO PRODUCTS designs (2026-10-22), forked
    # verbatim as static documents under /product-pages/ (importer:
    # scripts/import-products-v2.mjs; spec: specs/products-pages-v2.md).
    # The documents live outside the asset tree so addressing one directly
    # still passes through the gated location / below.
    location = /products {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        try_files /product-pages/index.html =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # A bare /product/<slug>: the v2 design when one exists, else the
    # prerendered React page, else the SPA shell. Sub-addresses (download,
    # releases, docs, privacy) do not match this pattern and are untouched.
    location ~ ^/product/(?<product_v2_slug>[^/]+)/?$ {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        try_files /product-pages/$product_v2_slug/index.html /product/$product_v2_slug/index.html @spa_shell;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Shared marketing navigation uses stable filenames on every design page.
    location ^~ /site/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # The v2 designs' own files (runtime, vendored React/Babel, images).
    # Unhashed names: no-cache, and ^~ keeps the 1y immutable rule out.
    location ^~ /products-v2/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Homepage: XENOsystem Home v21 (owner handoff, 2026-10-22) is a static
    # document under /home-v21/, forked verbatim from its runnable prototype
    # (scripts/import-homepage-v21.mjs) rather than transcribed into React.
    # Exact-match so only the root is affected; the gate still applies, and
    # every other address keeps falling through to the SPA below.
    location = / {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        try_files /home-v21/index.html =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header X-Download-Options "noopen" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # The v21 homepage files. Their names carry no content hash, so the
    # one-year immutable regex rule must never apply; ^~ stops it matching.
    # The homepage document itself is a page, not an asset: it stays gated
    # even when addressed directly (its scripts and images below are assets,
    # which the gate never covered). Exact match wins over the ^~ prefix.
    location = /home-v21/index.html {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ^~ /home-v21/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        auth_request /__site_gate;
        error_page 401 = /coming-soon.html;
        try_files $uri $uri/index.html $uri/ /index.html;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # KasmVNC proxy with authentication (^~ gives priority over regex matches)
    location ^~ /vnc/ {
        # Variable proxy_pass = deferred resolution; rewrite strips the /vnc/ prefix
        # to match the previous trailing-slash behaviour (proxy_pass .../;).
        rewrite ^/vnc/(.*)$ /$1 break;
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket support for VNC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject Basic Auth for KasmVNC (kasm_user:xenobrowser123)
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off for self-signed cert
        proxy_ssl_verify off;

        # Timeouts for long VNC sessions
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffering settings
        proxy_buffering off;
    }

    # KasmVNC WebSocket endpoint for VNC stream
    location ^~ /websockify {
        # Variable proxy_pass = deferred resolution. The original request URI
        # (/websockify) passes through unchanged, matching the previous behaviour.
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade - pass all required headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket origin headers (required by KasmVNC)
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-WebSocket-Origin $http_origin;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Inject Basic Auth
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off
        proxy_ssl_verify off;

        # Long timeouts for persistent WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time stream
        proxy_buffering off;
    }
}

# ── XENO Artifacts user-content host ───────────────────────────────────────────
# usercontent.xenostudio.ai serves ONLY the raw revision files of an artifact,
# authorized by the path-scoped view token. It is a separate host on purpose:
# the app's `__Host-` session cookies are host-bound, so an author's script
# (already an opaque origin under the CSP sandbox) runs on a host that has
# never seen a credential — the second wall Claude's *.claudeusercontent.com
# and ChatGPT's *.oaiusercontent.com provide. Everything else answers 404 here,
# including the shell, so nothing on this host can be mistaken for our UI.
server {
    listen 80;
    server_name usercontent.xenostudio.ai;

    # Same re-resolution as the main server: a `set` variable is per-server.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $backend_upstream backend:8080;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~ "^/a/a_[A-Za-z0-9]{22}/v/[^/]+/r/[0-9]+/.+$" {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_max_temp_file_size 0;
    }

    location / {
        return 404;
    }
}

# chat.xenosystem.ai: a short name for the chat. It holds nothing of its own; every address on it
# goes to the chat inside the workspace (the session cookies are bound to xenosystem.ai, so the chat
# must be used there). Temporary redirect, so the target can change without browsers remembering it.
server {
    listen 80;
    server_name chat.xenosystem.ai;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /health { access_log off; return 200 "ok"; }
    location / { return 302 https://xenosystem.ai/workspace/apps/chat; }
}

# storage.xenosystem.ai: a short name for XENO Storage. Like chat.xenosystem.ai it holds nothing of its own;
# every address on it goes to Storage inside the workspace, where the session lives.
server {
    listen 80;
    server_name storage.xenosystem.ai;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /health { access_log off; return 200 "ok"; }
    location / { return 302 https://xenosystem.ai/workspace/corpo/apps/storage; }
}

# www.xenosystem.ai: ONE host, so one gate cookie and one gate (owner, 2026-10-20). The gate cookie is __Host-, i.e.
# bound to the exact host, so a visitor let in on xenosystem.ai was asked again on www. Every address moves to the
# apex with its path and query. Pages take a 301; /api/ takes a 308 so a POST stays a POST with its body (a 301 turns
# it into a GET). No OAuth client registers a www redirect URI (checked on the box 2026-10-20), so sign-in is untouched.
server {
    listen 80;
    server_name www.xenosystem.ai;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /health { access_log off; return 200 "ok"; }
    location /api/ { return 308 https://xenosystem.ai$request_uri; }
    location / { return 301 https://xenosystem.ai$request_uri; }
}
