server {
    listen 80;
    server_name localhost;

    # Re-resolve Docker service names so backend container IP changes do not
    # strand nginx on a stale upstream after backend restarts/recreates.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $backend_upstream backend:8080;
    # Deferred (runtime) resolution for the optional KasmVNC browser container, so
    # nginx still starts when xeno-browser is not deployed/running. Using a variable
    # in proxy_pass below means nginx resolves it per-request (502 if down) instead of
    # aborting at startup with "host not found in upstream".
    set $xeno_browser_upstream xeno-browser:6901;

    # ==========================================================================
    # SECURITY SETTINGS
    # ==========================================================================

    # Block access to hidden files (.env, .git, .htaccess, etc.) — but NEVER
    # /.well-known/* (RFC 8615): it carries OIDC discovery
    # (/api/oauth2/.well-known/openid-configuration) and ACME challenges. The
    # negative lookahead lets those through to the proxy while still denying
    # real dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common attack vectors and scanners
    location ~* ^/(admin|wp-admin|wp-login\.php|wp-content|wordpress|phpmyadmin|\.git|\.svn|\.env|\.htaccess|config\.php|xmlrpc\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Executables & scripts must never fall through to the SPA ───────────────
    # The `location /` catch-all at the bottom answers ANY unmatched path with
    # index.html (200, text/html). For a page route that is correct; for a
    # script it is dangerous. /install.sh and /install.ps1 returned 200 with
    # 4,311 bytes of homepage HTML, and the agent-cli docs used to tell people to
    # run `curl -fsSL https://xenostudio.ai/install.sh | sh` — piping a web page
    # into a shell. The docs were fixed; the ROUTE still answered 200, so anyone
    # replaying that line from shell history kept hitting it. Same defect class
    # as the download gate (4283c0d): a route answering 200 for something that
    # does not exist.
    #
    # `try_files $uri =404` still serves a real file if we ever publish one, and
    # 404s otherwise — it removes the SPA fallback, not the ability to host a
    # script. Regex locations beat the `location /` prefix match regardless of
    # order, so this wins the catch-all; `^~ /vnc/` and `^~ /websockify` keep
    # their priority over it. The (?!/api/) guard keeps the backend proxy
    # reachable if an endpoint ever ends in one of these.
    #
    # NOTE — deliberately NO add_header here. In nginx, add_header is inherited
    # from the enclosing level ONLY while the current level declares none of its
    # own; adding a single header here would silently drop all eight
    # server-level security headers from these responses.
    # ".com" is deliberately NOT in this list — it would also match any path
    # ending in a hostname. Access logging stays ON: how much traffic still
    # replays the old curl one-liner is worth being able to see.
    location ~* ^(?!/api/).*\.(sh|bash|zsh|fish|ps1|psm1|bat|cmd|vbs|wsf|exe|msi|scr|dll|apk|dmg|pkg|deb|rpm|appimage|jar|py|rb|pl|php)$ {
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;

    # ── DE-INDEX (2026-08-11) ────────────────────────────────────────────────
    # The site is not meant to be publicly discoverable yet.
    #
    # This header — NOT a robots.txt `Disallow: /` — is what actually removes
    # pages from Google. `Disallow` blocks CRAWLING, which means Googlebot can
    # never fetch the page again and therefore never sees a noindex; already
    # indexed URLs then persist as bare links. robots.txt deliberately still
    # ALLOWS crawling so this header can be read and obeyed.
    #
    # Repeated in every `location` that declares its own add_header (see the
    # inheritance note above at the shell-extension block): a child level that
    # sets ANY header drops ALL inherited ones, so a single server-level
    # declaration would silently vanish exactly where assets are served.
    #
    # TO REVERSE: delete this line and the three copies below, rebuild, deploy,
    # then re-submit the sitemap in Search Console.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Hide server version
    server_tokens off;

    # ==========================================================================
    # UPLOAD & TIMEOUT SETTINGS
    # ==========================================================================

    # Large file upload support
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_body_timeout 600s;
    send_timeout 600s;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # API proxy to backend
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        # REST only. Connection: upgrade on every /api/ request is a latent
        # 502: nginx copied the websocket hop-by-hop header onto ordinary
        # POSTs (chat, tokenize, piston). Websockets live at /ws.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connect is "is the process listening?", not upload time.
        # 600s here held a refused backend for ten minutes after a crash.
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Large body support
        client_max_body_size 500M;
    }

    # WebSocket proxy for collaboration
    location /ws {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time
        proxy_buffering off;
    }
    
    # env-config.js is DYNAMIC runtime config (NOT content-hashed) — it must NEVER be
    # cached by browsers or the CDN. The generic 1-year `immutable` rule below once
    # pinned a secret-bearing build of this file in Cloudflare for its whole TTL
    # (the env-config key-leak incident). Exact-match `location =` wins over the regex
    # rule regardless of order, so this is the authoritative caching policy for it.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
    }

    # Static files with cache (content-hashed build assets only — safe to pin 1y).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-declared, and it matters most here: images are indexed by Google
        # Images independently of the page that embeds them, so without this the
        # screenshots and product art stay discoverable after the pages go.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    
    # Unified auth: the CLI/Hub browser-session page moved onto the branded
    # /auth/cli surface. Deployed CLIs still open /cli-auth?session=… — 308 it
    # (preserving the query) so they keep working. /cli-auth/device (code-entry)
    # stays on its own page for now (exact-match here doesn't touch sub-paths).
    location = /cli-auth {
        return 308 /auth/cli$is_args$args;
    }
    location = /cli-auth/device {
        return 308 /auth/cli/device$is_args$args;
    }

    # Stable product download deep-links (PRODUCT-PAGES-SPEC.md §4). ONLY the
    # OS-specific subpath /product/<slug>/download/<os>[/<version>] is proxied to
    # the backend, which 302s to the current installer on R2. The product page
    # (/product/<slug>) and the bare download page (/product/<slug>/download)
    # have no trailing OS segment, so they fall through to the SPA below.
    location ~ ^/product/[^/]+/download/[^/]+ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Legacy product-page redirects → canonical singular /product/* ──────────
    # PRODUCT-PAGES-SPEC.md §10. The old plural /products/<slug>/* static pages and
    # the legacy /download + /releases/* routes 301 to the canonical URLs.
    # $is_args$args preserves any query string. The bare /products index is NOT
    # matched here (regex requires a slug segment), so it falls through below.
    location ~ ^/products/([^/]+)/release-notes/([^/]+)/?$ { return 301 /product/$1/releases/$2$is_args$args; }
    location ~ ^/products/([^/]+)/release-notes/?$         { return 301 /product/$1/releases$is_args$args; }
    location ~ ^/products/([^/]+)/download/?$              { return 301 /product/$1/download$is_args$args; }
    location ~ ^/products/([^/]+)/docs(/.*)?$              { return 301 /product/$1/docs$is_args$args; }
    location ~ ^/products/([^/]+)/?$                       { return 301 /product/$1$is_args$args; }
    location = /download                                   { return 301 /product/hub/download$is_args$args; }
    location ~ ^/releases/([^/]+)/?$                       { return 301 /product/hub/releases/$1$is_args$args; }

    # Relative redirects so 301/308 keep the request's scheme (https behind the proxy)
    # instead of emitting http://.
    absolute_redirect off;

    # React Router — serve index.html for all routes. Trying $uri/index.html BEFORE
    # $uri/ serves the prerendered product pages directly (200) without nginx's
    # directory trailing-slash 301.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        # Re-declared: this level sets its own headers, so it inherits none.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # KasmVNC proxy with authentication (^~ gives priority over regex matches)
    location ^~ /vnc/ {
        # Variable proxy_pass = deferred resolution; rewrite strips the /vnc/ prefix
        # to match the previous trailing-slash behaviour (proxy_pass .../;).
        rewrite ^/vnc/(.*)$ /$1 break;
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket support for VNC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject Basic Auth for KasmVNC (kasm_user:xenobrowser123)
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off for self-signed cert
        proxy_ssl_verify off;

        # Timeouts for long VNC sessions
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffering settings
        proxy_buffering off;
    }

    # KasmVNC WebSocket endpoint for VNC stream
    location ^~ /websockify {
        # Variable proxy_pass = deferred resolution. The original request URI
        # (/websockify) passes through unchanged, matching the previous behaviour.
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade - pass all required headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket origin headers (required by KasmVNC)
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-WebSocket-Origin $http_origin;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Inject Basic Auth
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off
        proxy_ssl_verify off;

        # Long timeouts for persistent WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time stream
        proxy_buffering off;
    }
}
