server {
    listen 80;
    server_name localhost;

    # Re-resolve Docker service names so backend container IP changes do not
    # strand nginx on a stale upstream after backend restarts/recreates.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $backend_upstream backend:8080;
    # Deferred (runtime) resolution for the optional KasmVNC browser container, so
    # nginx still starts when xeno-browser is not deployed/running. Using a variable
    # in proxy_pass below means nginx resolves it per-request (502 if down) instead of
    # aborting at startup with "host not found in upstream".
    set $xeno_browser_upstream xeno-browser:6901;

    # ==========================================================================
    # SECURITY SETTINGS
    # ==========================================================================

    # Block access to hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block common attack vectors and scanners
    location ~* ^/(admin|wp-admin|wp-login\.php|wp-content|wordpress|phpmyadmin|\.git|\.svn|\.env|\.htaccess|config\.php|xmlrpc\.php)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header X-Download-Options "noopen" always;

    # Hide server version
    server_tokens off;

    # ==========================================================================
    # UPLOAD & TIMEOUT SETTINGS
    # ==========================================================================

    # Large file upload support
    client_max_body_size 500M;
    client_body_buffer_size 128k;
    client_body_timeout 600s;
    send_timeout 600s;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    
    # API proxy to backend
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for large uploads
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Large body support
        client_max_body_size 500M;
    }

    # WebSocket proxy for collaboration
    location /ws {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time
        proxy_buffering off;
    }
    
    # Static files with cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # KasmVNC proxy with authentication (^~ gives priority over regex matches)
    location ^~ /vnc/ {
        # Variable proxy_pass = deferred resolution; rewrite strips the /vnc/ prefix
        # to match the previous trailing-slash behaviour (proxy_pass .../;).
        rewrite ^/vnc/(.*)$ /$1 break;
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket support for VNC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject Basic Auth for KasmVNC (kasm_user:xenobrowser123)
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off for self-signed cert
        proxy_ssl_verify off;

        # Timeouts for long VNC sessions
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffering settings
        proxy_buffering off;
    }

    # KasmVNC WebSocket endpoint for VNC stream
    location ^~ /websockify {
        # Variable proxy_pass = deferred resolution. The original request URI
        # (/websockify) passes through unchanged, matching the previous behaviour.
        proxy_pass https://$xeno_browser_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade - pass all required headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket origin headers (required by KasmVNC)
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-WebSocket-Origin $http_origin;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Inject Basic Auth
        proxy_set_header Authorization "Basic a2FzbV91c2VyOnhlbm9icm93c2VyMTIz";

        # SSL verification off
        proxy_ssl_verify off;

        # Long timeouts for persistent WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # No buffering for real-time stream
        proxy_buffering off;
    }
}
