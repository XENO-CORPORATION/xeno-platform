<!DOCTYPE html>
<!-- `xeno` brings the XENO Elements theme tokens into scope for the whole document and lets any XENO
     component render correctly wherever it is adopted. It restyles nothing on its own: every rule in
     that stylesheet is scoped to a `.xeno-*` class, and no component here carries one yet.
     `xeno-scroll-wake` opts the PAGE scrollbar into the system one — absent until the page moves, then
     a rail with the thumb on it. It is gated on the `data-scrolling` attribute that main.tsx sets,
     because the document element counts as hovered whenever the pointer is anywhere in the window. -->
<html lang="en" class="xeno xeno-scroll-wake">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Xeno Studio</title>
    <!-- v2.0.1 Deployment Marker -->
    <!-- Ensure mobile viewport height works correctly -->
    <style>
      :root {
        --vh: 1vh;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: #121212; /* Dark background */
        color: #e0e0e0; /* Light text */
        overscroll-behavior: none; /* Prevent pull-to-refresh or other overscroll behaviors */
        touch-action: manipulation; /* Disable double-tap zoom on mobile while allowing pinch zoom */
      }

      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Scrollbars are XENO Elements' now — see `scrollbar.css`. A third copy of them used to live
         here: an 8px webkit bar in #3a3a3d, and under it a universal `* { scrollbar-width: thin }`
         "for Firefox".

         That last rule is why none of it ever drew. Since Chrome 121, an element with `scrollbar-width`
         set has its `::-webkit-scrollbar` pseudo-elements IGNORED — and on `*` that is the whole
         document, so the eight rules above it were dead the moment they were written, with nothing
         anywhere to say so. The same pair existed twice more, in `src/index.css`, hiding the same way.

         The lesson is in the pairing, not the values: the two styling models are mutually exclusive,
         and writing both is not belt-and-braces, it is switching the good one off. */

      /* Animated Ellipsis for "Okay, let me figure out..." */
      .thinking-ellipsis .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: currentColor; /* Use the text color */
        border-radius: 50%;
        margin-left: 2px;
        animation: ellipsis-pulse 1.4s infinite ease-in-out;
      }

      .thinking-ellipsis .dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .thinking-ellipsis .dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      .thinking-ellipsis .dot:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes ellipsis-pulse {
        0%, 80%, 100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1.0);
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Polyfill for Node.js global variable in browser environment
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <!-- Runtime environment configuration -->
    <script src="/env-config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
