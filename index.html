<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Xeno Studio</title>
    <!-- v2.0.1 Deployment Marker -->
    <!-- Ensure mobile viewport height works correctly -->
    <style>
      :root {
        --vh: 1vh;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: #121212; /* Dark background */
        color: #e0e0e0; /* Light text */
        overscroll-behavior: none; /* Prevent pull-to-refresh or other overscroll behaviors */
        touch-action: manipulation; /* Disable double-tap zoom on mobile while allowing pinch zoom */
      }

      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Custom Scrollbar Styles */
      /* For Webkit browsers (Chrome, Safari) */
      ::-webkit-scrollbar {
        width: 8px; /* Width of the scrollbar */
        height: 8px; /* Height of the scrollbar for horizontal scroll */
      }

      ::-webkit-scrollbar-track {
        background: #1e1e1e; /* Color of the track (the area the scrollbar moves in) */
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb {
        background: #3a3a3d; /* Color of the scrollbar thumb (the draggable part) */
        border-radius: 4px; /* Rounded corners for the thumb */
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #555; /* Color of the thumb on hover */
      }

      /* For Firefox */
      * {
        scrollbar-width: thin; /* "auto" or "thin" */
        scrollbar-color: #3a3a3d #1e1e1e; /* thumb and track color */
      }

      /* Animated Ellipsis for "Okay, let me figure out..." */
      .thinking-ellipsis .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background-color: currentColor; /* Use the text color */
        border-radius: 50%;
        margin-left: 2px;
        animation: ellipsis-pulse 1.4s infinite ease-in-out;
      }

      .thinking-ellipsis .dot:nth-child(1) {
        animation-delay: -0.32s;
      }

      .thinking-ellipsis .dot:nth-child(2) {
        animation-delay: -0.16s;
      }

      .thinking-ellipsis .dot:nth-child(3) {
        animation-delay: 0s;
      }

      @keyframes ellipsis-pulse {
        0%, 80%, 100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1.0);
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Polyfill for Node.js global variable in browser environment
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <!-- Runtime environment configuration -->
    <script src="/env-config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
