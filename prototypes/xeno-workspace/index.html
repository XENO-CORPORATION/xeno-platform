<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XENO Workspace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== tokens — the platform's dark chat theme, monochrome per DESIGN_SYSTEM.md ===== */
:root{
  --canvas:#0a0a0a; --rail:#171717; --rail-stroke:#242424; --panel:#111111; --panel-stroke:#242424;
  --elevated:#262626; --control:#1f1f1f; --hover:rgba(255,255,255,.06); --hover-strong:#333333;
  --text:#fafafa; --muted:#a3a3a3; --dim:#8b8b92; /* WCAG 2.2 AA: ≥4.5:1 on every dark surface (was #6f6f6f ≈ 3.7:1) */ --border:rgba(255,255,255,.10); --danger:#ef4444;
  --rail-w:56px; --panel-w:268px; --gap-x:7px; --gap-y:6.5px; --gap-yb:7px; --r:14px; --flare:15px;
  --open:cubic-bezier(.22,.9,.24,1); --close:cubic-bezier(.45,0,.2,1);
  color-scheme:dark;
}

(--canvas));--n57:color-mix(in srgb,var(--text) 19.6%,var(--canvas));--n58:color-mix(in srgb,var(--text) 20%,var(--canvas));--n62:color-mix(in srgb,var(--text) 21.7%,var(--canvas));--n68:color-mix(in srgb,var(--text) 24.2%,var(--canvas));--n74:color-mix(in srgb,var(--text) 26.7%,var(--canvas));--n75:color-mix(in srgb,var(--text) 27.1%,var(--canvas));--n85:color-mix(in srgb,var(--text) 31.3%,var(--canvas));--n88:color-mix(in srgb,var(--text) 32.5%,var(--canvas));--n90:color-mix(in srgb,var(--text) 33.3%,var(--canvas));--n91:color-mix(in srgb,var(--text) 33.8%,var(--canvas));--n92:color-mix(in srgb,var(--text) 34.2%,var(--canvas));--n93:color-mix(in srgb,var(--text) 34.6%,var(--canvas));--n94:color-mix(in srgb,var(--text) 35%,var(--canvas));--n95:color-mix(in srgb,var(--text) 35.4%,var(--canvas));--n102:color-mix(in srgb,var(--text) 38.3%,var(--canvas));--n106:color-mix(in srgb,var(--text) 40%,var(--canvas));--n110:color-mix(in srgb,var(--text) 41.7%,var(--canvas));--n111:color-mix(in srgb,var(--text) 42.1%,var(--canvas));--n119:color-mix(in srgb,var(--text) 45.4%,var(--canvas));--n128:color-mix(in srgb,var(--text) 49.2%,var(--canvas));--n129:color-mix(in srgb,var(--text) 49.6%,var(--canvas));--n136:color-mix(in srgb,var(--text) 52.5%,var(--canvas));--n138:color-mix(in srgb,var(--text) 53.3%,var(--canvas));--n140:color-mix(in srgb,var(--text) 54.2%,var(--canvas));--n141:color-mix(in srgb,var(--text) 54.6%,var(--canvas));--n144:color-mix(in srgb,var(--text) 55.8%,var(--canvas));--n145:color-mix(in srgb,var(--text) 56.3%,var(--canvas));--n154:color-mix(in srgb,var(--text) 60%,var(--canvas));--n163:color-mix(in srgb,var(--text) 63.8%,var(--canvas));--n164:color-mix(in srgb,var(--text) 64.2%,var(--canvas));--n171:color-mix(in srgb,var(--text) 67.1%,var(--canvas));--n175:color-mix(in srgb,var(--text) 68.8%,var(--canvas));--n191:color-mix(in srgb,var(--text) 75.4%,var(--canvas));--n200:color-mix(in srgb,var(--text) 79.2%,var(--canvas));--n203:color-mix(in srgb,var(--text) 80.4%,var(--canvas));--n204:color-mix(in srgb,var(--text) 80.8%,var(--canvas));--n207:color-mix(in srgb,var(--text) 82.1%,var(--canvas));--n216:color-mix(in srgb,var(--text) 85.8%,var(--canvas));--n218:color-mix(in srgb,var(--text) 86.7%,var(--canvas));--n230:color-mix(in srgb,var(--text) 91.7%,var(--canvas));--n233:color-mix(in srgb,var(--text) 92.9%,var(--canvas));--n237:color-mix(in srgb,var(--text) 94.6%,var(--canvas));--n240:color-mix(in srgb,var(--text) 95.8%,var(--canvas));--n242:color-mix(in srgb,var(--text) 96.7%,var(--canvas));--n244:color-mix(in srgb,var(--text) 97.5%,var(--canvas));--n250:var(--text);--n255:var(--text);
--w20:color-mix(in srgb,var(--text) 2%,transparent);--w25:color-mix(in srgb,var(--text) 2.5%,transparent);--w30:color-mix(in srgb,var(--text) 3%,transparent);--w35:color-mix(in srgb,var(--text) 3.5%,transparent);--w40:color-mix(in srgb,var(--text) 4%,transparent);--w45:color-mix(in srgb,var(--text) 4.5%,transparent);--w50:color-mix(in srgb,var(--text) 5%,transparent);--w60:color-mix(in srgb,var(--text) 6%,transparent);--w70:color-mix(in srgb,var(--text) 7%,transparent);--w75:color-mix(in srgb,var(--text) 7.5%,transparent);--w80:color-mix(in srgb,var(--text) 8%,transparent);--w90:color-mix(in srgb,var(--text) 9%,transparent);--w100:color-mix(in srgb,var(--text) 10%,transparent);--w120:color-mix(in srgb,var(--text) 12%,transparent);--w130:color-mix(in srgb,var(--text) 13%,transparent);--w140:color-mix(in srgb,var(--text) 14%,transparent);--w160:color-mix(in srgb,var(--text) 16%,transparent);--w180:color-mix(in srgb,var(--text) 18%,transparent);--w200:color-mix(in srgb,var(--text) 20%,transparent);--w220:color-mix(in srgb,var(--text) 22%,transparent);--w250:color-mix(in srgb,var(--text) 25%,transparent);--w260:color-mix(in srgb,var(--text) 26%,transparent);--w300:color-mix(in srgb,var(--text) 30%,transparent);--w350:color-mix(in srgb,var(--text) 35%,transparent);--w400:color-mix(in srgb,var(--text) 40%,transparent);--w450:color-mix(in srgb,var(--text) 45%,transparent);--w500:color-mix(in srgb,var(--text) 50%,transparent);--w550:color-mix(in srgb,var(--text) 55%,transparent)}
/* end theme scale */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
img{display:block}

/* ===== RAIL — global, identical in every mode (MODES §7) ===== */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail-w);background:var(--rail);z-index:30;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--rail-stroke)}
html[data-panel="open"] .rail::after, html[data-peek] .rail::after{top:calc(var(--flare) + 1px);bottom:calc(var(--flare) + 1px)}
.logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:6px;position:relative;transition:transform .2s var(--open)}
.logo:hover{background:var(--hover)}
.logo:active{transform:scale(.94)}
.logo .mk{width:30px;height:30px;transition:opacity .18s ease,transform .28s var(--open)}
.logo .mk.swap{opacity:0;transform:scale(.8) rotate(-45deg)}
.logo .mk.morph{position:absolute;left:5px;top:5px;width:30px;height:30px}
.logo .dot{position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-radius:2px;background:var(--text);opacity:0;transition:opacity .2s}
html[data-view="dashboard"] .logo .dot{opacity:0}
.rbtn{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn[aria-current="true"]{background:var(--hover-strong);color:var(--text)}

.rbtn img{width:22px;height:22px}
.rbtn .badge{position:absolute;top:7px;right:7px;min-width:8px;height:8px;border-radius:4px;background:var(--text);box-shadow:0 0 0 2px var(--rail)}
.rsep{width:24px;height:1px;background:var(--rail-stroke);margin:6px 0}
.rgrow{flex:1}
.credits{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:4px 0;border-radius:6px;width:40px;text-align:center}
.credits:hover{color:var(--text);background:var(--hover)}
.avatar{width:30px;height:30px;border-radius:8px;background:var(--elevated);display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:4px}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--elevated);border:1px solid var(--border);color:var(--text);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .16s var(--open)}
.tip.on{opacity:1;transform:none}
.tip kbd{font:11px Inter;color:var(--muted);margin-left:8px}


/* rail mode zone */
.rzone{display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .14s ease,transform .2s var(--open)}
.rzone.out{opacity:0;transform:translateX(-6px);transition:opacity .12s ease,transform .14s ease}
.rzone.in{opacity:0;transform:translateX(6px)}

/* ===== PANEL — one shell, many contents ===== */
@property --fr{syntax:'<length>';inherits:true;initial-value:15px}
.slot{position:fixed;top:0;bottom:0;left:var(--rail-w);width:calc(var(--panel-w) + var(--gap-x));padding:var(--gap-y) 0 var(--gap-yb) var(--gap-x);z-index:20;--fr:var(--flare);transition:--fr .3s var(--open)}
/* the rail's inverted corners: solid, morph to straight when the panel closes */
.slot::before,.slot::after{content:"";position:absolute;left:0;width:calc(var(--fr) + 1px);height:calc(var(--fr) + 1px);pointer-events:none}
.slot::before{top:0;background:radial-gradient(circle at 100% 100%,transparent calc(var(--fr) - .4px),var(--rail-stroke) var(--fr),var(--rail-stroke) calc(var(--fr) + .6px),var(--rail) calc(var(--fr) + 1px))}
.slot::after{bottom:0;background:radial-gradient(circle at 100% 0,transparent calc(var(--fr) - .4px),var(--rail-stroke) var(--fr),var(--rail-stroke) calc(var(--fr) + .6px),var(--rail) calc(var(--fr) + 1px))}
.panel{height:100%;background:var(--panel);border:1px solid var(--panel-stroke);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;clip-path:inset(0 0 0 0 round var(--r));transition:clip-path .3s var(--open)}
.panel > .pv{transition:opacity .2s ease .08s,transform .3s var(--open)}
html[data-panel="closed"]:not([data-peek]) .slot{--fr:0px;pointer-events:none;transition:--fr .24s var(--close)}
html[data-panel="closed"]:not([data-peek]) .panel{clip-path:inset(0 100% 0 0 round var(--r));transition:clip-path .24s var(--close)}
html[data-panel="closed"]:not([data-peek]) .panel > .pv{opacity:0;transform:translateX(-10px);transition:opacity .13s ease,transform .24s var(--close)}
html[data-panel="none"] .slot{--fr:0px;pointer-events:none}
html[data-panel="none"] .panel{clip-path:inset(0 100% 0 0 round var(--r))}
html[data-panel="none"] .panel > .pv{opacity:0}
.peekzone{position:fixed;left:var(--rail-w);top:0;bottom:0;width:10px;z-index:25;display:none}
html[data-panel="closed"] .peekzone{display:block}

/* panel content */
.pv{display:flex;flex-direction:column;min-height:0;flex:1;width:calc(var(--panel-w) - 2px)}
.pv.swap-out{opacity:0!important;transform:translateY(4px)!important;transition:opacity .1s ease,transform .1s ease!important}
.ph{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 14px;flex:none}
.ph .mk{width:22px;height:22px;flex:none}
.ph .ttl{flex:1;min-width:0;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ttl small{display:block;font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0;margin-top:1px}
.ph .crumb{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:500;font-size:12.5px}
.ph .crumb b{color:var(--text);font-weight:600}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg.i{width:16px;height:16px}
.pbody{flex:1;overflow-y:auto;padding:4px 8px 12px;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.act{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;color:var(--text);font-size:13.5px}
.act:hover{background:var(--hover)}
.act.primary{background:var(--control);border:1px solid var(--border);margin-bottom:6px}
.act.primary:hover{background:var(--n38)}
.act kbd{margin-left:auto;font:10.5px Inter;color:var(--dim)}
.act svg.i{width:16px;height:16px;color:var(--muted)}
.sec{margin-top:14px}
.sh{display:flex;align-items:center;justify-content:space-between;height:24px;padding:0 4px 0 10px;color:var(--dim);font-size:12px;font-weight:500}
.sh button.t{display:flex;align-items:center;gap:4px;color:var(--dim)}
.sh button.t svg{width:11px;height:11px;opacity:0;transition:opacity .15s,transform .2s}
.sec:hover .sh button.t svg{opacity:1}
.sec.closed .sh button.t svg{transform:rotate(-90deg)}
.sec.closed .sbody{display:none}
.sh .acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.sec:hover .sh .acts{opacity:1}
.sh .acts .ib{width:22px;height:22px}
.sh .acts svg.i{width:13px;height:13px}
.grp{padding:8px 10px 2px;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.row{position:relative;display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px 0 10px;border-radius:8px;color:var(--muted);font-size:13.5px}
.row:hover,.row[data-menu-open]{background:var(--hover);color:var(--text)}
.row[aria-current="true"]{background:var(--hover-strong);color:var(--text)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11px;color:var(--dim);flex:none}
.row img,.row .code{width:20px;height:20px;flex:none}
.row .more{display:none;width:22px;height:22px;border-radius:6px;place-items:center;color:var(--muted);flex:none;margin-left:auto}
.row:hover .more,.row:focus-within .more,.row[data-menu-open] .more{display:grid}
.row:hover .more ~ .meta,.row:has(.more):hover .meta,.row[data-menu-open] .meta{display:none}
.row .meta{margin-left:auto}
.row:hover .meta,.row[data-menu-open] .meta{display:none}
.row .more:hover{background:var(--hover-strong);color:var(--text)}
.row.soon .t{color:var(--dim)}
.row .tag{font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:0 5px;line-height:16px;flex:none}
.row:hover .tag{display:none}
.row .pin{width:11px;height:11px;color:var(--dim);flex:none}
.row.sub{color:var(--dim);font-size:12.5px}
.row.sub:hover{color:var(--text)}
.kids{margin:1px 0 4px 19px;padding-left:8px;border-left:1px solid var(--border)}
.kids .row{height:29px;padding-left:9px}
.tw{width:14px;height:14px;display:grid;place-items:center;color:var(--dim);transition:transform .18s;flex:none}
.open > .row .tw{transform:rotate(90deg)}
.pj:not(.open) > .kids{display:none}
.code{border-radius:5px;background:var(--n11);border:1px solid var(--n46);display:grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.modecard{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;color:var(--text)}
.modecard:hover{background:var(--hover)}
.modecard .mk{width:28px;height:28px;flex:none}
.modecard b{display:block;font-weight:500;font-size:13.5px}
.modecard small{display:block;color:var(--dim);font-size:11.5px}
.modecard kbd{margin-left:auto;font:10.5px Inter;color:var(--dim)}
.modecard[aria-current="true"]{background:var(--hover-strong)}
.pfoot{flex:none;border-top:1px solid var(--border);padding:8px}


/* the mode switcher as a panel state */
html[data-switching] .slot{--fr:var(--flare)!important;pointer-events:auto!important;transition:--fr .3s var(--open)!important}
html[data-switching] .panel{clip-path:inset(0 0 0 0 round var(--r))!important;transition:clip-path .3s var(--open)!important}
html[data-switching] .rail::after{top:calc(var(--flare) + 1px);bottom:calc(var(--flare) + 1px)}
.modecard.big{padding:10px;gap:12px;border-radius:11px;margin-bottom:2px}
.modecard.big .mk{width:34px;height:34px}
.modecard.big b{font-size:14px}
.modecard kbd{white-space:nowrap}
.modecard small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modecard > span:not(.mk){min-width:0;flex:1}
.mk.custom{display:grid;place-items:center;border:1px dashed var(--border);border-radius:8px;color:var(--muted)}
.mk.custom svg.i{width:16px;height:16px}


/* ===== mode switcher (panel state) ===== */
.msw{display:flex;flex-direction:column;height:100%;min-height:0}
.msw-head{padding:10px 10px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border)}
.msw-cur{display:flex;align-items:center;gap:11px;padding:4px 2px 2px 4px}
.msw-cur .ib{margin-left:auto;align-self:flex-start}
.msw-eyebrow{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:1px}
.msw-cur .msw-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.msw-searchwrap{padding:0 8px 8px;border-bottom:1px solid var(--border)}
.msw-ph .ttl{font-size:14px;line-height:1.2}
.msw-ph .ttl small{margin-top:1px}
.msw-inline{display:flex;align-items:center;gap:10px}
.msw-bar{width:1px;height:14px;background:var(--border);flex:none}
.msw-count{font-size:12.5px;font-weight:400;color:var(--dim)}
.msw-list{border-top:1px solid var(--border)}
.msw-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:var(--canvas);border:1px solid var(--border);color:var(--dim)}
.msw-search:focus-within{border-color:var(--w200)}
.msw-search svg.i{width:15px;height:15px}
.msw-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:inherit;font-size:13px}
.msw-search input::placeholder{color:var(--dim)}
.msw-search kbd{font:10.5px Inter;color:var(--dim);white-space:nowrap}
.msw-list{flex:1;overflow-y:auto;padding:6px 8px;scrollbar-width:none}
.msw-list::-webkit-scrollbar{display:none}
.msw-sep{height:1px;background:var(--border);margin:6px 8px}

/* the switcher LAYER — sweeps in over the panel, the panel stays visible behind it */
.panel{position:relative}

  clip-path:inset(0 100% 0 0);transition:clip-path .22s var(--close)}
.msw-layer.on{clip-path:inset(0 0 0 0);transition:clip-path .3s var(--open)}
.msw-layer > .msw{transform:translateX(-10px);opacity:0;transition:opacity .12s ease,transform .22s var(--close)}
.msw-layer.on > .msw{transform:none;opacity:1;transition:opacity .2s ease .06s,transform .3s var(--open)}
.msw-layer::after{content:"";position:absolute;top:0;bottom:0;right:0;width:1px;background:var(--panel-stroke);opacity:0;transition:opacity .2s}

.ap-menu{position:fixed;z-index:2147483647;display:none;flex-direction:column;padding:5px;background:var(--menu);border:1px solid var(--line-menu);border-radius:8px;font:12px/1.4 Inter,system-ui,sans-serif;color:var(--t2)}

.hm-prod div{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.hm-prod b{font-weight:500;font-size:13.5px}.hm-prod small{color:var(--n129);font-size:12px}
.hm-prod.soon b{color:var(--n129)}

/* notifications + help */
:is(#menu,#menu-ghost).ntm{width:320px}
.nt-head{display:flex;align-items:center;justify-content:space-between;padding:8px 9px 6px}
.nt-head b{font-size:13px;font-weight:600}
.nt-all{font-size:11.5px;color:var(--n171);padding:2px 6px;border-radius:4px}.nt-all:hover{color:var(--n244);background:var(--w60)}
:is(#menu,#menu-ghost) .mi.nt{align-items:flex-start;gap:10px;height:auto;padding:7px 9px}
.nt-dot{width:6px;height:6px;border-radius:1.5px;margin-top:6px;flex:none;background:transparent}
.mi.nt.unread .nt-dot{background:var(--n244)}
.nt-t{display:flex;flex-direction:column;gap:2px;min-width:0}.nt-t b{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nt-t small{font-size:11px;color:var(--n129)}
.mi.nt:not(.unread) .nt-t b{color:var(--n171);font-weight:400}
/* ===== rail popovers v4 — built in the sidebar's language ======================================
   The shell is a small copy of the workspace itself: canvas-coloured, holding panel-coloured plates
   with the panel stroke and a narrow gap — the same relation the sidebar and main area have on the
   canvas. Type, row heights and captions are the sidebar's (.ph · .sh · .row), so the popover reads
   as part of the shell instead of a separate widget. Content is sized to fit on open: no scrolling. */
.rp{box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:4px;background:var(--canvas);border:1px solid var(--panel-stroke);border-radius:var(--r);box-shadow:0 22px 56px rgba(0,0,0,.6);overflow:hidden!important}
.rp .pl{flex:none;background:var(--panel);border:1px solid var(--n29);border-radius:10px}
.pl-stack{display:flex;flex-direction:column;gap:4px;min-height:0;flex:1 1 auto;overflow-y:auto;scrollbar-width:none}
.pl-stack::-webkit-scrollbar{display:none}
/* header — the sidebar's .ph, one size down */
.pl-head{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px}
.pl-head b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.pl-head .pp-tools{margin-left:auto;display:flex;gap:2px}
.pl-pill{font-size:10.5px;font-weight:600;color:var(--n10);background:var(--text);border-radius:4px;padding:1px 6px;font-variant-numeric:tabular-nums;flex:none}
.pl-fresh{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pl-fresh.err{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.pp-ib{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted);flex:none}
.pp-ib:hover,.pp-ib:focus-visible{background:var(--hover);color:var(--text);outline:none}
.pp-ib svg.i{width:15px;height:15px}
/* section caption — the sidebar's .sh: sentence case, dim, count on the right */
.pl-list{padding:2px 4px 4px}
.pl-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;height:28px;padding:0 6px 0 8px;font-size:12px;font-weight:500;color:var(--dim)}
.pl-cap span:last-child{font-size:11px;font-variant-numeric:tabular-nums}
/* nav plate: view tabs + filter chips in ONE plate (was two) */
.pl-nav{padding:4px;display:flex;flex-direction:column;gap:4px}
.pp-tabs{display:flex;gap:2px}
.pp-tabs button{flex:1;height:28px;border-radius:7px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.pp-tabs button:hover{color:var(--text);background:var(--hover)}
.pp-tabs button[aria-selected="true"]{background:var(--elevated);color:var(--text)}
.pp-tabs button svg.i{width:14px;height:14px;color:inherit}
.pp-tabs button span{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.pl-chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 2px 2px}
.pl-chips::-webkit-scrollbar{display:none}
.pl-chips button{flex:none;height:24px;padding:0 9px;border-radius:6px;font-size:11.5px;color:var(--muted);background:var(--control);border:1px solid transparent}
.pl-chips button:hover{color:var(--text)}
.pl-chips button[aria-pressed="true"]{background:var(--text);color:var(--n10)}
.pp-tabs button:focus-visible,.pl-chips button:focus-visible,.pl-seg button:focus-visible,.pl-link:focus-visible,.us-held:focus-visible,.pl-more:focus-visible{outline:1px solid var(--w450);outline-offset:1px}
/* footer */
.pl-foot{display:flex;align-items:center;gap:12px;height:32px;padding:0 6px 0 12px;font-size:11px;color:var(--dim)}
.pl-foot kbd{font:10.5px Inter;color:var(--muted);margin-right:3px}
.pl-link{margin-left:auto;display:flex;align-items:center;gap:3px;height:24px;padding:0 6px;border-radius:6px;font-size:12px;color:var(--muted)}
.pl-link:hover{color:var(--text);background:var(--hover)}.pl-link svg.i{width:12px;height:12px}
.pl-more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;height:28px;margin-top:2px;border-radius:7px;font-size:12px;color:var(--muted)}
.pl-more:hover{background:var(--hover);color:var(--text)}.pl-more svg.i{width:12px;height:12px}
/* empty / error / loading */
.pp-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:26px 22px 28px}
.pp-empty svg.i{width:20px;height:20px;color:var(--dim);margin-bottom:3px}
.pp-empty b{font-size:13px;font-weight:500}.pp-empty small{font-size:12px;color:var(--dim);max-width:250px;line-height:1.45}
.pl-error .us-ghost{margin-top:6px;height:28px;padding:0 14px}
.pl-skel{display:flex;flex-direction:column;gap:9px;padding:14px 12px}
.pl-skel i{display:block;height:9px;border-radius:3px;background:linear-gradient(90deg,var(--n24) 0,var(--n35) 40%,var(--n24) 80%);background-size:300% 100%;animation:xw-shim 1.3s linear infinite}
@keyframes xw-shim{from{background-position:100% 0}to{background-position:-100% 0}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ---- notification row — the sidebar's .row, two lines ---- */
.nt2{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 6px 5px 8px;border-radius:8px;cursor:pointer;position:relative}
.nt2:hover,.nt2:focus-visible{background:var(--hover);outline:none}
.nt2:focus-visible{box-shadow:inset 0 0 0 1px var(--w180)}
.nt2-mark{position:absolute;left:2px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:transparent}
.nt2.unread .nt2-mark{background:var(--text)}
.nt2-ic{width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:7px;background:var(--control)}
.nt2-ic img,.nt2-ic .code{width:18px;height:18px;border-radius:4px}.nt2-ic svg.i{width:14px;height:14px;color:var(--muted)}
.nt2-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.nt2-t b{font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt2.unread .nt2-t b,.nt2-grp .nt2-t b{font-weight:500;color:var(--text)}
.nt2-t small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt2-t small em{font-style:normal;color:var(--muted)}
.nt2-r{display:flex;align-items:center;gap:2px;flex:none}
.nt2-act{height:26px;min-width:64px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text);background:var(--elevated);display:flex;align-items:center;justify-content:center;margin-right:2px}
.nt2-act:hover{background:var(--hover-strong)}
.nt2 .nt2-r .pp-ib{opacity:0;pointer-events:none;transition:opacity .12s}
.nt2:hover .nt2-r .pp-ib,.nt2:focus-within .nt2-r .pp-ib{opacity:1;pointer-events:auto}
.nt2-done,.nt2-wake{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);padding:0 6px}
.nt2-done svg.i,.nt2-wake svg.i{width:13px;height:13px}
.nt2-wake{color:var(--muted)}
.nt2.done .nt2-t b{color:var(--muted)}
.nt2-snz{display:flex;gap:4px;align-items:center;margin:0 4px 4px 46px;padding:4px;border-radius:8px;background:var(--control)}
.nt2-snz button:not(.pp-ib){height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--text);background:var(--elevated)}
.nt2-snz button:not(.pp-ib):hover,.nt2-snz button:not(.pp-ib):focus-visible{background:var(--hover-strong);outline:none}
.nt2-snz .pp-ib{margin-left:auto}
.nt2-chev{width:26px;height:26px;display:grid;place-items:center;color:var(--dim)}.nt2-chev svg.i{width:14px;height:14px}
.nt2-kids{margin-left:22px;padding-left:4px;border-left:1px solid var(--panel-stroke)}
.nt2-kids .nt2{min-height:38px}.nt2-kids .nt2-ic{width:24px;height:24px}
.nt2.arrived{animation:xw-arrive .5s var(--open)}
@keyframes xw-arrive{from{background:var(--w100);transform:translateY(-4px);opacity:.4}to{background:transparent;transform:none;opacity:1}}
.rail .rbtn.ring svg.i{animation:xw-ring .6s ease 2}
@keyframes xw-ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.nt-seg-row{display:flex;align-items:center;gap:10px;padding:4px 8px}
/* ---- shared controls ---- */
.pl-seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--control)}
.pl-seg button{height:24px;padding:0 10px;border-radius:6px;font-size:11.5px;color:var(--muted)}
.pl-seg button:hover{color:var(--text)}
.pl-seg button[aria-checked="true"]{background:var(--elevated);color:var(--text)}
.us-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 8px;border-radius:8px;font-size:13px;text-align:left}
.us-toggle:hover,.us-toggle:focus-visible{background:var(--hover);outline:none}
.hp-t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;text-align:left}

.sw{width:28px;height:16px;border-radius:5px;background:var(--elevated);position:relative;flex:none;transition:background .15s}

.us-toggle[aria-checked="true"] .sw{background:var(--text)}.us-toggle[aria-checked="true"] .sw i{transform:translateX(12px);background:var(--n10)}
.us-primary,.us-ghost{height:30px;border-radius:8px;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.us-primary{background:var(--text);color:var(--n10);font-weight:500;border:1px solid var(--text)}.us-primary:hover{background:var(--n255)}
.us-ghost{color:var(--text);background:var(--control);border:1px solid var(--border)}.us-ghost:hover{background:var(--elevated)}
.us-ghost svg.i{width:13px;height:13px;color:var(--muted)}
.us-actions{display:flex;gap:4px;padding:4px!important;height:auto!important}
.us-actions button{flex:1}
.us-actions button:focus-visible{outline:1px solid var(--w450);outline-offset:1px}
/* ---- help ---- */
.pl-head-search{flex-direction:column;align-items:stretch;gap:6px;height:auto;padding:10px 8px 8px}
.pl-head-search b{padding:0 4px}
.pp-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;background:var(--control);border:1px solid var(--border)}
.pp-search:focus-within{border-color:var(--w180)}
.pp-search svg.i{width:14px;height:14px;color:var(--dim)}
.pp-search input{flex:1;background:none;border:0;outline:none;color:var(--text);font:13px Inter;min-width:0}
.pp-search input:focus,.pp-search input:focus-visible{outline:none;box-shadow:none}
.pp-search input::placeholder{color:var(--n91)}
.pp-search kbd{font:10.5px Inter;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:0 5px}
.rp .mi.hp{display:flex;align-items:center;gap:10px;width:100%;height:auto;min-height:32px;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--text)}
.rp .mi.hp:hover,.rp .mi.hp:focus-visible{background:var(--hover);outline:none}
.rp .mi.hp svg.i{width:16px;height:16px;color:var(--muted);flex:none}
.rp .mi.hp kbd{margin-left:auto;font:10.5px Inter;color:var(--dim)}
.hp-t mark{background:none;color:var(--text);font-weight:600}
.hp-new{width:6px;height:6px;border-radius:1.5px;background:var(--text);flex:none}
.pl-tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none}
.rp .hp-tile{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;min-height:46px!important;padding:6px 10px!important;border-radius:10px!important;text-align:left}
.rp .hp-tile svg.i{width:16px!important;height:16px!important;color:var(--text)!important}
.rp .hp-tile b{font-size:12.5px;font-weight:500;display:block}
.rp .hp-tile small{font-size:11px;color:var(--dim);display:block}
.rp .hp-tile > span{display:flex;flex-direction:column;gap:1px;min-width:0}
.rp .hp-news{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:3px;padding:9px 12px 10px!important;border-radius:10px!important;text-align:left}
.hp-news-k{display:flex;align-items:center;gap:6px;width:100%;font-size:11px;font-weight:500;color:var(--muted)}
.hp-news-k svg.i{width:13px!important;height:13px!important;color:var(--muted)}
.hp-news-k em{margin-left:auto;font-style:normal;color:var(--dim)}
.rp .hp-news b{font-size:13px;font-weight:500;color:var(--text)}
.rp .hp-news small{font-size:12px;color:var(--dim);line-height:1.45;white-space:normal}
.pp-status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.pp-status:hover{color:var(--text)}
.pp-status .ok{width:6px;height:6px;border-radius:1.5px;background:var(--text);flex:none}
.pl-foot .v{margin-left:auto;color:var(--dim)}
/* ---- usage ---- */
.us-bal{padding:10px 12px 12px}
.us-k{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:500;color:var(--dim);margin-bottom:4px}
.us-hero{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
.us-big{font-size:26px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.us-unit{font-size:12px;color:var(--muted)}
.us-comp{display:flex;gap:2px;height:6px}
.us-comp i{display:block;height:100%;border-radius:2px}
.us-comp .a{background:var(--text)}
.us-comp .h{background:repeating-linear-gradient(135deg,var(--n111) 0 3px,var(--n38) 3px 6px);min-width:4px}
.us-legend{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.us-legend span{display:flex;align-items:center;gap:6px}
.us-legend i{width:7px;height:7px;border-radius:1.5px;display:block}
.us-legend .a{background:var(--text)}

.us-spend{padding:4px 4px 6px}
.us-ctl{display:flex;justify-content:space-between;gap:6px;padding:0 0 6px}
.us-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 4px 10px;border-radius:8px;background:var(--control)}

.us-stat + .us-stat{border-left:1px solid var(--panel-stroke)}
.us-stat small{font-size:11px;color:var(--dim)}
.us-stat b{font-size:15px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.us-stack{display:flex;gap:2px;height:6px;margin:0 8px 6px}

.us-pc{color:var(--dim);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums}

.us-lg.us-act{grid-template-columns:1fr auto 48px}

.us-act .us-t{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}

.us-warn svg.i{width:15px;height:15px;color:var(--text);flex:none;margin-top:1px}.us-warn b{color:var(--text);font-weight:500}
.rail .credits.low{color:var(--text);background:repeating-linear-gradient(135deg,var(--w90) 0 3px,transparent 3px 6px)}
/* ---- undo toast ---- */
#utoast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:320;display:flex;align-items:center;gap:12px;padding:5px 5px 5px 14px;border-radius:10px;background:var(--elevated);border:1px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:13px;transition:opacity .16s,transform .22s var(--open)}
#utoast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#utoast button{height:26px;padding:0 10px;border-radius:7px;background:var(--text);color:var(--n10);font-weight:500;font-size:12px}
#utoast kbd{font:10.5px Inter;color:var(--dim);margin-right:6px}
/* ---- the Inbox page: the same plates at page width ---- */
.rp-page{max-width:820px}
.rp-page-tools{display:flex;align-items:center;gap:8px}
.rp-page-shell{margin-top:18px;box-shadow:none!important}
.rp-page-shell > .pl-stack{overflow:visible}
/* ---- shortcut sheet ---- */
#kbsheet{position:fixed;inset:0;z-index:330;display:none;place-items:center;background:rgba(0,0,0,.55)}
#kbsheet.on{display:grid}
.kb-shell{width:min(640px,calc(100vw - 32px))}
.kb-cols{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.kb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 8px;font-size:13px;color:var(--muted)}
.kb-keys{display:flex;gap:4px}
.kb-or{font-size:11px;color:var(--dim);align-self:center;padding:0 2px}

@media (max-width:620px){.kb-cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pl-skel i,.nt2.arrived,.rail .rbtn.ring svg.i{animation:none}}

/* ===== rail popovers v5 — hierarchy and motion =====================================================
   Fewer things on screen at once: tabs are the header, filters open on demand, the action sits under
   the time instead of beside the title, and secondary links live in the footer as icons. Everything
   that changes state moves (segments slide, rows lift, arrows nudge) so the UI explains itself. */
.rp{gap:4px}
.rp .pl{transition:border-color .15s,background .15s}
.rp button{transition:background .14s,color .14s,border-color .14s,transform .12s}
.rp button:active:not(:disabled){transform:scale(.97)}
/* header with text tabs and a sliding underline */
.nt-head{height:44px;padding:0 6px 0 4px}
.nt-tabs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;gap:2px;height:100%;align-items:stretch}
.nt-tabs button{position:relative;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:13px;font-weight:500;color:var(--dim);border-radius:7px}
.nt-tabs button:hover{color:var(--muted)}
.nt-tabs button[aria-selected="true"]{color:var(--text)}
.nt-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--text);animation:xw-tab .22s var(--open)}
@keyframes xw-tab{from{transform:scaleX(.4);opacity:0}to{transform:none;opacity:1}}
.nt-tabs button span{min-width:18px;height:17px;padding:0 5px;border-radius:5px;background:var(--elevated);color:var(--muted);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.nt-tabs button[aria-selected="true"] span{background:var(--text);color:var(--n10)}
.nt-tabs button:focus-visible{outline:1px solid var(--w450);outline-offset:-4px}
.pp-ib[aria-pressed="true"]{background:var(--elevated);color:var(--text)}
.rp .pl-chips{padding:6px;gap:4px;border-radius:10px;animation:xw-drop .2s var(--open)}
@keyframes xw-drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* section caption: lead count is a solid badge, others a quiet number */
.pl-cap{height:30px;padding:0 8px 0 10px}
.pl-count{min-width:18px;height:17px;padding:0 5px;border-radius:5px;background:var(--text);color:var(--n10)!important;font-size:10.5px!important;font-weight:600;display:grid;place-items:center}
.pl-list{padding:0 4px 4px}
/* ---- notification row v5 ---- */
.nt2{align-items:flex-start;gap:11px;min-height:0;padding:9px 8px 9px 10px;border-radius:8px;transition:background .14s}
.nt2 + .nt2{margin-top:1px}
.nt2-mark{top:14px;margin-top:0;height:14px}
.nt2-ic{width:32px;height:32px;border-radius:8px;background:var(--control);border:1px solid var(--n31);transition:transform .16s var(--open),border-color .14s}
.nt2-ic img,.nt2-ic .code{width:18px;height:18px}
.nt2:hover .nt2-ic{transform:scale(1.04);border-color:var(--n44)}
.nt2-main{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.nt2-top,.nt2-bot{display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.nt2-top{min-height:18px}
.nt2-top b{flex:1;min-width:0;font-size:13px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt2.unread .nt2-top b,.nt2-grp .nt2-top b{color:var(--text);font-weight:500}
.nt2-top time{flex:none;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;transition:opacity .12s}
.nt2-bot{min-height:24px}
.nt2-bot small{flex:1;min-width:0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt2-bot small em{font-style:normal;color:var(--text);background:var(--elevated);border-radius:4px;padding:1px 5px;margin-right:6px;font-size:10.5px;font-weight:500}
/* hover swaps the time for the row's tools — no width is ever reserved for them */
.nt2-tools{position:absolute;right:-4px;top:50%;transform:translateY(-50%);display:flex;gap:1px;padding:0 0 0 14px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--n31) 12px)}
.nt2-tools .pp-ib{width:24px;height:24px;border-radius:6px}
.nt2-tools .pp-ib svg.i{width:14px;height:14px}
.nt2:hover .nt2-tools,.nt2:focus-visible .nt2-tools,.nt2:has(.nt2-tools :focus-visible) .nt2-tools{opacity:1;pointer-events:auto}
.nt2:hover .nt2-top time,.nt2:focus-visible .nt2-top time{opacity:0}
.nt2 .nt2-r,.nt2 .nt2-tools .pp-ib{opacity:1}
.nt2-act{flex:none;height:24px;min-width:0;padding:0 10px;margin:0;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--text);background:transparent;border:1px solid var(--border)}
.nt2-act:hover{background:var(--elevated);border-color:var(--n58)}
.nt2-act.primary{background:var(--text);color:var(--n10);border-color:var(--text)}
.nt2-act.primary:hover{background:var(--n255)}
.nt2-done{flex:none;font-size:11.5px;padding:0;animation:xw-drop .2s var(--open)}
.nt2-wake{flex:none;font-size:11.5px;padding:0}
.nt2-snz{flex-wrap:wrap;margin:0 4px 6px 53px;padding:6px;gap:4px;border:1px solid var(--n31);animation:xw-drop .18s var(--open)}
.nt2-snz > span{width:100%;font-size:11px;color:var(--dim);padding:0 2px 2px}
/* actor burst: the icon carries the count */
.nt2-stackic{position:relative}
.nt2-stackic::before{content:"";position:absolute;inset:3px -3px -3px 3px;border-radius:8px;border:1px solid var(--n38);background:var(--control);z-index:-1}
.nt2-stackic i{position:absolute;right:-5px;bottom:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:5px;background:var(--elevated);border:1px solid var(--canvas);font-style:normal;font-size:10px;font-weight:600;display:grid;place-items:center;color:var(--text)}
.nt2-grp .nt2-chev{flex:none;width:20px;height:20px;transition:transform .2s var(--open)}
.nt2-grp.open .nt2-chev{transform:rotate(180deg)}
.nt2-kids{margin:0 0 4px 26px;padding-left:6px;border-left:1px solid var(--panel-stroke);animation:xw-drop .2s var(--open)}
.nt2-kids .nt2{padding-top:7px;padding-bottom:7px}
.nt2-kids .nt2-ic{width:26px;height:26px}
.nt2-kids .nt2-bot{display:none}
.nt2-kids .nt2-main{justify-content:center;min-height:26px}
/* the "more" link and the footer link nudge on hover */
.pl-more{height:30px;margin-top:2px;justify-content:flex-start;padding:0 10px;color:var(--dim)}
.pl-more svg.i,.pl-link svg.i,.hp-go svg.i{transition:transform .16s var(--open)}
.pl-more:hover svg.i,.pl-link:hover svg.i{transform:translateX(2px)}
.rp .pl-foot{height:34px}
/* empty state with a framed icon */
.pp-empty-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--control);border:1px solid var(--n31);margin-bottom:6px}
.pp-empty-ic svg.i{margin:0!important}
/* ---- segmented control with a sliding thumb ---- */
.pl-seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;padding:2px;border-radius:8px;background:var(--control);isolation:isolate}
.pl-seg[data-seg]::before{content:"";position:absolute;z-index:-1;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:6px;background:var(--elevated);box-shadow:0 1px 0 var(--w40) inset;transform:translateX(calc(var(--i) * 100%));transition:transform .24s var(--open)}
.pl-seg.seg-noanim::before{transition:none}
.pl-seg[data-seg] button,.pl-seg[data-seg] button[aria-checked="true"]{background:transparent}
.pl-seg button{height:26px;padding:0 10px;white-space:nowrap}
.pl-seg button[aria-checked="true"]{color:var(--text)}
/* ---- help v5 ---- */
.help-hero{padding:14px 10px 10px!important;gap:10px!important;background:linear-gradient(180deg,var(--n21),var(--panel))!important}
.help-hero b{font-size:15px!important;letter-spacing:-.015em}
.hp-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none}
.rp .hp-q{display:flex!important;flex-direction:column;align-items:flex-start;gap:8px;min-height:0!important;padding:11px 10px 10px!important;border-radius:10px!important;position:relative}
.rp .hp-q b{font-size:12px;font-weight:500;line-height:1.25;white-space:normal;text-align:left}
.rp .hp-q kbd{position:absolute;top:10px;right:9px;margin:0!important;font-size:10px!important;color:var(--dim)}
.hp-q-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--control);border:1px solid var(--n31);transition:transform .18s var(--open),background .14s}
.rp .hp-q .hp-q-ic svg.i{width:15px!important;height:15px!important;color:var(--text)!important}
.rp .hp-q:hover{background:var(--n22)!important;border-color:var(--n42)}
.rp .hp-q:hover .hp-q-ic{transform:translateY(-1px);background:var(--elevated)}
.rp .hp-news{position:relative;padding:12px 40px 12px 12px!important;background:radial-gradient(120% 140% at 100% 0%,var(--n29) 0%,var(--panel) 55%)!important}
.rp .hp-news:hover{border-color:var(--n42)}
.hp-badge{font-size:10px;font-weight:600;color:var(--n10);background:var(--text);border-radius:4px;padding:1px 5px;margin-right:2px}
.hp-go{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);background:var(--control);opacity:.0;transition:opacity .14s}
.rp .hp-news:hover .hp-go,.rp .hp-news:focus-visible .hp-go{opacity:1}
.rp .hp-news:hover .hp-go svg.i{transform:translateX(2px)}
.rp .hp-tip{gap:10px}
.rp .hp-tip svg.i{color:var(--dim)!important}
.hp-tip .hp-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp-tag{flex:none;font-size:10.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:0 6px;line-height:17px}
.hp-links{margin-left:auto;display:flex;gap:2px}
/* ---- usage v5 ---- */
.us-bal{padding:12px 12px 12px}
.us-k{margin-bottom:6px}
.us-alert{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;color:var(--muted);background:var(--control);border:1px solid transparent}
.us-alert svg.i{width:12px;height:12px}
.us-alert[aria-checked="true"]{color:var(--text);border-color:var(--border)}
.us-alert:hover{background:var(--elevated)}
.us-spend{padding:8px 8px 6px}
.us-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 8px 4px;font-size:12px;font-weight:500;color:var(--dim)}
.us-head .pl-seg{width:150px}
.us-stats{margin:0 0 8px;background:transparent;border:1px solid var(--n31)}
.us-stat{padding:8px 10px}
.us-view{margin-bottom:6px}
.us-list{min-height:150px}
.us-list .us-stack{margin:6px 4px 8px}
.us-list .us-lg{padding:0 6px}
.us-lg{transition:background .12s}
.us-lg:hover{background:var(--hover)}
.rp .mi.hp .hp-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp .mi.hp .hp-t small{overflow:hidden;text-overflow:ellipsis}

/* v5 fine-tune */
.nt2-bot:not(:has(.nt2-act,.nt2-done,.nt2-wake,.nt2-chev)){min-height:0}
.nt2:not(:has(.nt2-act,.nt2-done,.nt2-wake,.nt2-chev)) .nt2-main{gap:3px;justify-content:center;min-height:32px}
.rp .mi.hp.hp-q{align-items:flex-start!important;justify-content:flex-start;gap:10px}
.hp-q-t{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.rp .hp-q .hp-q-t b{font-size:12.5px;white-space:nowrap}
.rp .hp-q .hp-q-t small{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp .hp-news b,.rp .hp-news small{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.us-list{min-height:0}
.rp .hp-news b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hp-tipgo{flex:none;display:grid;place-items:center;opacity:0;transition:opacity .14s,transform .16s var(--open)}.rp .hp-tipgo svg.i{width:13px!important;height:13px!important}
.rp .hp-tip:hover .hp-tipgo,.rp .hp-tip:focus-visible .hp-tipgo{opacity:1;transform:translateX(2px)}
/* ---- account popover v5 ---- */
.acc-id{display:flex;align-items:center;gap:11px;padding:12px;background:radial-gradient(120% 160% at 0% 0%,var(--n27) 0%,var(--panel) 60%)!important}
.acc-av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--text);color:var(--n10);flex:none}
.acc-who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;text-align:left}
.acc-who b{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-who small{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-id .acc-who b{font-size:14px;font-weight:600}
.acc-plan{flex:none;font-size:10.5px;font-weight:600;color:var(--text);border:1px solid var(--border);border-radius:5px;padding:2px 7px;background:var(--control)}
.acc-ws{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.acc-ws + .acc-ws{margin-top:1px}
.acc-ws:hover,.acc-ws:focus-visible{background:var(--hover);outline:none}
.acc-ws:focus-visible{box-shadow:inset 0 0 0 1px var(--w180)}
.acc-ws.on{background:var(--control)}
.acc-wsav{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--elevated);color:var(--text);flex:none;transition:transform .16s var(--open)}
.acc-ws.on .acc-wsav{background:var(--text);color:var(--n10)}
.acc-ws:hover .acc-wsav{transform:scale(1.04)}
.acc-cur{flex:none;display:grid;place-items:center;width:22px;height:22px;color:var(--text)}.acc-cur svg.i{width:15px;height:15px}
.acc-go{flex:none;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;opacity:0;transform:translateX(-3px);transition:opacity .14s,transform .16s var(--open)}
.acc-ws:hover .acc-go,.acc-ws:focus-visible .acc-go{opacity:1;transform:none}
.acc-new .acc-wsav{background:transparent;border:1px dashed var(--n58);color:var(--muted)}
.acc-new .acc-wsav svg.i{width:14px;height:14px}
.acc-new b{color:var(--muted)!important}
.acc-new:hover b{color:var(--text)!important}
.acc-links{padding:4px}
.acc-li{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border-radius:8px;font-size:13px;color:var(--text);text-align:left}
.acc-li:hover,.acc-li:focus-visible{background:var(--hover);outline:none}
.acc-li svg.i{width:16px;height:16px;color:var(--muted);flex:none;transition:color .14s}
.acc-li:hover svg.i{color:var(--text)}
.acc-li span{flex:1}
.acc-li kbd,.acc-meta{flex:none!important;font:11px Inter;color:var(--dim);font-variant-numeric:tabular-nums}
.acc-foot{padding:0 4px!important;justify-content:space-between}
.acc-close{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:4px;font-size:12.5px;color:var(--muted)}
.acc-close:hover,.acc-close:focus-visible{background:var(--hover);color:var(--text);outline:none}
.acc-close kbd{font:10.5px Inter;color:var(--dim)}
.acc-out{margin-left:auto;display:flex;align-items:center;gap:7px;height:26px;padding:0 8px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.acc-out:hover,.acc-out:focus-visible{background:var(--hover);color:var(--text);outline:none}
.acc-out svg.i{width:15px;height:15px}
.rp .acc-close{border-radius:4px}
/* ---- tighter corners inside the popovers: square elements, small radii (shell keeps the panel's 14px) ---- */
.rp .pl,.rp .pl-chips{border-radius:6px!important}
.rp .nt2,.rp .acc-ws,.rp .acc-li,.rp .mi.hp,.rp .us-lg,.rp .us-toggle,.rp .pl-more,.rp .nt2-snz,.rp .us-stats,.rp .pp-search{border-radius:5px!important}
.rp .nt2-ic,.rp .acc-wsav,.rp .hp-q-ic,.rp .pp-empty-ic,.rp .nt2-stackic::before{border-radius:5px!important}
.rp .acc-av{border-radius:6px!important}
.rp .nt2-ic img,.rp .nt2-ic .code{border-radius:3px!important}
.rp .pp-ib,.rp .nt2-tools .pp-ib,.rp .nt2-act,.rp .pl-link,.rp .acc-out,.rp .acc-go,.rp .us-alert,.rp .us-held,.rp .hp-go,.rp .nt2-snz button,.rp .pl-chips button,.rp .nt-tabs button{border-radius:4px!important}
.rp .us-primary,.rp .us-ghost{border-radius:5px!important}
.rp .pl-seg{border-radius:5px!important}
.rp .pl-seg[data-seg]::before,.rp .pl-seg button{border-radius:3px!important}
.rp .pl-pill,.rp .pl-count,.rp .nt-tabs button span,.rp .nt2-stackic i,.rp .hp-badge,.rp .acc-plan,.rp .hp-tag,.rp .nt2-bot small em,.rp .pp-search kbd{border-radius:3px!important}
.rp .sw{border-radius:3px!important}.rp .sw i{border-radius:2px!important}
.rp .us-comp i,.rp .us-stack i,.rp .us-bar,.rp .us-bar i{border-radius:1px!important}
#utoast{border-radius:6px}#utoast button{border-radius:4px}
.kb-keys kbd{border-radius:3px!important}
/* ---- Adaptive consent dialog: the rail-popover construction at modal size ---- */
#adModal{position:fixed;inset:0;z-index:340;display:none;place-items:center;padding:16px}
#adModal.on{display:grid}
.adc-back{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:adc-fade .18s ease}
.adc{position:relative;width:min(760px,100%);max-height:calc(100vh - 32px);box-shadow:0 30px 80px rgba(0,0,0,.65);animation:adc-in .26s var(--open)}
@keyframes adc-fade{from{opacity:0}}
@keyframes adc-in{from{opacity:0;transform:translateY(8px) scale(.985)}}
.adc-head{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 12px}
.adc-mk{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:var(--text);color:var(--n10);flex:none}
.adc-mk svg.i{width:18px;height:18px}
.adc-ht{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.adc-ht b{font-size:15px;font-weight:600;letter-spacing:-.015em}
.adc-ht small{font-size:12px;color:var(--dim)}
.adc-body{display:grid;grid-template-columns:5fr 6fr;gap:4px;min-height:0;overflow-y:auto;scrollbar-width:none}
.adc-why{padding:16px 14px 14px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(120% 90% at 0% 0%,var(--n25) 0%,var(--panel) 60%)!important}
.adc-why > p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.adc-why > p b{color:var(--text);font-weight:600}
/* the demo: three rows quietly trading places, the way Adaptive moves things */
.adc-demo{position:relative;height:104px;border-radius:5px;background:var(--canvas);border:1px solid var(--n31);overflow:hidden}
.adc-drow{position:absolute;left:8px;right:8px;height:28px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:4px;background:var(--panel);border:1px solid var(--n34);font-size:12.5px;color:var(--text);animation:adc-swap 7.5s var(--open) infinite;animation-delay:calc(var(--k) * -2.5s)}
.adc-drow img{width:16px;height:16px;border-radius:3px}
.adc-drow span{flex:1}
.adc-drow i{width:22px;height:3px;border-radius:1px;background:var(--n51)}
@keyframes adc-swap{0%,28%{top:8px}33%,61%{top:38px}66%,94%{top:68px}100%{top:8px}}
.adc-promises{list-style:none;margin:auto 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.adc-promises li{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--dim);line-height:1.4}
.adc-promises li svg.i{width:15px;height:15px;color:var(--text);flex:none;margin-top:1px}
.adc-promises li b{display:block;font-size:12.5px;font-weight:500;color:var(--text)}
.adc-detail{padding:2px 6px 10px}
.adc-sig{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:5px;cursor:pointer}
.adc-sig:hover{background:var(--hover)}
.adc-sig.locked{cursor:default}.adc-sig.locked:hover{background:transparent}
.adc-sig input{position:absolute;opacity:0;pointer-events:none}
.adc-box{width:16px;height:16px;flex:none;margin-top:1px;border-radius:3px;border:1px solid var(--n74);display:grid;place-items:center;color:transparent;transition:background .14s,border-color .14s}
.adc-box svg.i{width:12px;height:12px}
.adc-sig input:checked + .adc-box{background:var(--text);border-color:var(--text);color:var(--n10)}
.adc-sig.locked input:checked + .adc-box{background:var(--n90);border-color:var(--n90)}
.adc-sig input:focus-visible + .adc-box{outline:1px solid var(--w500);outline-offset:2px}
.adc-st{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.adc-st b{font-size:13px;font-weight:500}
.adc-st small{font-size:11.5px;color:var(--dim);line-height:1.4}
.adc-req{flex:none;font-size:10.5px;color:var(--dim);border:1px solid var(--border);border-radius:3px;padding:0 6px;line-height:17px;margin-top:1px}
.adc-cap2{margin-top:4px}

.panel .act[data-go="search"]{margin:4px 0 2px;background:var(--w30);border:1px solid var(--p-line);color:var(--p-t5)}
.panel .act[data-go="search"]:hover{border-color:var(--w120);color:var(--p-t3);background:var(--w40)}
.panel .act kbd{font:10.5px Inter;color:var(--p-t5);padding:1px 5px;border-radius:3px;background:var(--w50)}
/* sections: quiet labels, generous separation, count as a small plate */
.panel .sec{margin-top:18px}
.panel .views + .sec,.panel .act + .sec{margin-top:14px}
.panel .sh{height:24px;padding:0 6px 0 8px;font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--p-t5)}
.panel .sh button.t{color:inherit}
.panel .cnt-inline{margin-left:6px;padding:1px 5px;border-radius:3px;background:var(--w80);color:var(--p-t2);font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.panel .views{margin:6px 0 0}
/* rows: one left column (16px glyph slot) for every row, so text always starts at the same x */
.panel .row{height:30px;gap:10px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--p-t3)}
.panel .row svg.i{width:15px;height:15px;color:var(--p-t4);transition:color .12s}
.panel .row:hover,.panel .row[data-menu-open]{background:var(--p-wash);color:var(--p-t1)}
.panel .row:hover svg.i{color:var(--p-t2)}
.panel .row[aria-current="true"]{background:var(--p-wash2);color:var(--p-t1)}
/* selection = one plate that slides between items (panel-sel.js); the row's own fill is the no-JS fallback */
.panel .pbody{position:relative}
.panel .psel{position:absolute;left:0;top:0;width:0;height:0;border-radius:6px;background:var(--p-wash2);box-shadow:inset 0 0 0 1px var(--w35);opacity:0;pointer-events:none;
  transition:transform .32s cubic-bezier(.16,1,.3,1),height .32s cubic-bezier(.16,1,.3,1),width .32s cubic-bezier(.16,1,.3,1),opacity .18s ease}
.panel .psel.on{opacity:1}
.panel .psel.still{transition:none}
.panel .pbody:has(> .psel.on) .row[aria-current="true"]{background:transparent}
.panel .pbody:has(> .psel.on) .row[aria-current="true"]:hover{background:var(--w25)}
.panel .row{transition:color .14s ease,background-color .12s ease}
@media (prefers-reduced-motion:reduce){.panel .psel{transition:opacity .12s ease}}
/* folding is a motion, not a jump: the section body collapses to its heading */
.panel .sbody,.panel .pj > .kids{interpolate-size:allow-keywords;overflow:clip;height:auto;transition:height .26s var(--open),opacity .18s ease,display .26s allow-discrete}
/* only a section the user is OPENING grows from 0 — a freshly rendered panel must not animate every section */
@starting-style{.panel .sec.folding:not(.closed) .sbody,.panel .pj.folding.open > .kids{height:0;opacity:0}}
/* closed rows leave the layout once the motion ends (display:none), so nothing can find or focus them */
.panel .sec.closed .sbody,.panel .pj:not(.open) > .kids{display:none;height:0;opacity:0;transition:height .22s var(--close),opacity .14s ease,display .22s allow-discrete}
.panel .sh button.t svg{transition:opacity .15s,transform .22s var(--open)}
@media (prefers-reduced-motion:reduce){.panel .sbody,.panel .pj > .kids{transition:none}}
.panel .row[aria-current="true"] svg.i{color:var(--p-t1)}
.panel .row .row-mk{width:15px;height:15px;flex:none;display:grid;place-items:center;opacity:.72;transition:opacity .12s}
.panel .row .row-mk svg{width:15px;height:15px}
.panel .row:hover .row-mk,.panel .row[aria-current="true"] .row-mk{opacity:1}
/* keyboard focus is a quiet inset edge on the row (never an outline that spills past it) */
.panel .row:focus-visible,.panel .act:focus-visible,.panel .sh button.t:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--w220)}
.panel .sh button.t:focus-visible{border-radius:4px}
.panel .sh button.t:focus-visible svg{opacity:1}
.panel .row .gl{width:15px;height:15px;flex:none;display:grid;place-items:center}
.panel .row .gl::after{content:"";width:4px;height:4px;border-radius:1px;background:var(--w130);transition:background .12s}
.panel .row:hover .gl::after{background:var(--w450)}
.panel .row[aria-current="true"] .gl::after{background:var(--p-t1)}
.panel .row.needrow .gl::after{background:var(--p-t1)}
.panel .row img,.panel .row .code{width:15px;height:15px;border-radius:3px}
.panel .row .meta{font-size:11px;color:var(--p-t5);font-variant-numeric:tabular-nums}
.panel .row.soon{color:var(--p-t5)}
.panel .row .tag{border-radius:3px;border-color:var(--p-line);color:var(--p-t5)}
.panel .row.sub{color:var(--p-t5);font-size:12.5px}
.panel .row.sub:hover{color:var(--p-t2)}
.panel .row .need{background:none;border:0;color:var(--p-t4);font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;flex:none}
.panel .row:hover .need{background:var(--p-t1);color:var(--n10)}
.panel .row.needrow{color:var(--p-t2)}
.panel .row.needrow .gl::after{width:5px;height:5px}
.panel .row .more{width:20px;height:20px;border-radius:4px}
.panel .grp{padding:10px 8px 3px;font-size:10.5px;color:var(--p-t5);letter-spacing:.04em}
.panel .msw-help{color:var(--p-t5)!important;font-size:12px;line-height:1.45}
.panel .pfoot{border-top:1px solid var(--p-line);padding:6px 8px 8px}
.panel .empty-note{border:1px solid var(--p-line);background:var(--w20);border-radius:6px}
.panel .ctx-note{padding:0 8px 6px;color:var(--p-t5)}

/* rail icon size — ChatGPT/Claude draw ~22px glyphs in a 40px target; ours read small at 18 */
.rail .rbtn svg.i{width:22px;height:22px}
.rail .rbtn.sm svg.i{width:20px;height:20px}
.rail .rcat svg.i{width:20px;height:20px}

/* category labels — readable (Teams app bar ~10-11px), never tinted, breathing room from the icon */
.rail .rbtn.rcat{height:40px;gap:3px;padding-top:1px}
.rail .rcat .rcat-l{font-size:10.5px!important;font-weight:500;line-height:1;letter-spacing:0;color:var(--n191)!important}
.rail .rcat:hover .rcat-l,.rail .rcat[aria-expanded="true"] .rcat-l,.rail .rcat[aria-current="true"] .rcat-l{color:var(--n244)!important}
.rail .rcat svg.i{width:19px;height:19px}

.rail .rbtn:not(.rcat):not(.sm){height:34px}

/* DESIGN_SYSTEM §3: no circles — rail status marks are small squares */
.rbtn .live{border-radius:2px!important}
.rbtn .badge{border-radius:2px!important}
.rbtn .cnt{border-radius:4px!important}

/* M3 rail: label on the selected destination only. Fixed 40px button — the icon slides up 6px and the
   label fades into space that is already there, so nothing outside the button moves. */
.rail .rbtn.rcat{height:40px!important;display:block!important;padding:0!important;position:relative}
.rail .rcat svg.i{position:absolute;left:50%;top:50%;width:20px!important;height:20px!important;margin:-10px 0 0 -10px;transition:transform .18s cubic-bezier(.22,.9,.24,1)}
.rail .rcat .rcat-l{position:absolute;left:0;right:0;bottom:3px;text-align:center;opacity:0;transform:translateY(3px);transition:opacity .16s ease,transform .18s cubic-bezier(.22,.9,.24,1);pointer-events:none}
.rail .rcat[aria-expanded="true"] svg.i,.rail .rcat[aria-current="true"] svg.i{transform:translateY(-6px);width:18px!important;height:18px!important;margin:-9px 0 0 -9px}
.rail .rcat[aria-expanded="true"] .rcat-l,.rail .rcat[aria-current="true"] .rcat-l{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rail .rcat svg.i,.rail .rcat .rcat-l{transition:none}}

/* main area = a surface like the panel: same gaps from the panel and the window edges, same radius and stroke */
.main{top:var(--gap-y);right:var(--gap-x);bottom:var(--gap-yb);left:calc(var(--rail-w) + var(--panel-w) + var(--gap-x) * 2);background:var(--panel);border:1px solid var(--panel-stroke);border-radius:var(--r);clip-path:inset(0 round var(--r))}
html[data-panel="closed"] .main,html[data-panel="none"] .main{left:calc(var(--rail-w) + var(--gap-x))}
.main .live-dash,.main .live-chat-host{border-radius:inherit}

/* the chat column sits ON the main surface — no second, darker card inside it */
.main .live-chat-host,.main .live-chat{background:transparent!important;--chat-canvas:transparent;--chat-bg:transparent}
.main .live-chat-host *[class*="bg-[var(--chat-canvas)]"]{background:transparent!important}
html body .main .live-chat .chat-themed.chat-theme-dark{background:transparent!important}
/* mode intro right column: anchored, not floated — the heading sits on the same top line as the
   preview's toggle, the decision sits on the same bottom line as the preview's caption, and the
   leftover height goes between the picker and the decision (never above the heading or below the buttons) */
#modeIntro .mi-copy{justify-content:flex-start!important;padding-top:clamp(16px,1.6vw,26px)!important;padding-bottom:clamp(16px,1.6vw,26px)!important}

#modeIntro .mi-copy .adx-btns{margin-top:10px!important}
#modeIntro .mi-copy .mi-pick{margin-top:clamp(14px,2.2vh,26px)}
