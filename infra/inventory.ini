# The XENO estate, as code.
#
# CONTROL NODE is the Proxmox host, deliberately. It is always on, it sits
# BELOW the VMs, and rebuilding a VM starts there anyway — a control node that
# lives on one of its own targets cannot rebuild that target.
[platform]
xeno-platform-001 ansible_host=192.168.2.225 ansible_user=bunker

[gateway]
xeno-private-api-001 ansible_host=192.168.2.224 ansible_user=bunker

[hypervisor]
bnkr-node-001 ansible_connection=local

[vms:children]
platform
gateway

[all:vars]
ansible_python_interpreter=/usr/bin/python3
dr_gpg_fpr=12B1F40DEC4D7172AC76E395E0C0668AFE3DCE5C
r2_remote=r2backup:xeno-db-backups
