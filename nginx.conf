server {
    listen 80;
    server_name localhost;

    # Re-resolve Docker service names so backend container IP changes do not
    # strand nginx on a stale upstream after backend restarts/recreates.
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;
    set $backend_upstream backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    # CRITICAL: Allow large file uploads (100MB)
    client_max_body_size 100M;
    client_body_buffer_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    proxy_request_buffering off;

    # Buffer settings for large static files
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Output buffering for large files
    output_buffers 8 256k;
    postpone_output 1460;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Cache static assets with hashed filenames (immutable)
    location ~* \.[0-9a-f]{8,}\.(js|css|woff2?|ttf|png|jpg|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache fonts, images, media (1 day)
    location ~* \.(woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|webp|avif|ico|mp4|webm)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
        access_log off;
    }

    # Cache CSS and JS (1 day with revalidation)
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=3600";
    }

    # HTML pages — short cache, always revalidate
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend with large file support
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Large file upload settings
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
