# The `npm test` chain — 26 steps that, until 2026-08-16, ran nowhere but a
# workstation.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
#
# Two CI workflows were already here (core-tests, money-tests) and neither runs
# `npm test`. So every gate written for the Forum — the SQL placeholder check
# across 663 queries, the surface-parity decision record, the XSS payload
# battery, the de-index protections, the column-mention sweep — existed and was
# checked only when somebody happened to run it locally.
#
#   A gate that does not run is a comment.
#
# That is the same sentence this repo has needed four times: xeno-workflow's 76
# unregistered node types, xeno-tools' never-called `install`, the Forum's
# write-only flags, and a surface-parity gate that was written and then not added
# to the chain. Writing the check is the easy half.
#
# ── DELIBERATELY NO DATABASE AND NO NETWORK ─────────────────────────────────
#
# Everything in `npm test` is a source-level or pure-logic gate. The things that
# need a live system — `proof:*` (real database, rolled-back transactions) and
# `smoke:*` (the deployed site, a real browser) — are NOT here on purpose: a
# check that needs production to be up is a check that goes red for reasons that
# have nothing to do with the commit, and a red that means nothing gets ignored.
#
# They stay operator-run, and the release runbook is where they are required.

name: gates

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'nginx/**'
      - 'public/robots.txt'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gates.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'nginx/**'
      - 'public/robots.txt'
      - 'Dockerfile.frontend'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gates.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` needs the lockfile to be installable on Linux. ⚠️ npm on Windows
      # writes `@esbuild/*` platform entries without `optional: true`, which makes
      # `npm ci` on Linux treat a foreign binary as required and fail EBADPLATFORM
      # before any step runs. This repo is developed on Windows, so the fallback
      # is deliberate rather than lazy — see xeno-workflow's CI notes, which hit
      # exactly this.
      - name: Install (root)
        run: npm ci || npm install

      # 🔴 `src/server` HAS ITS OWN package.json, and the chain needs it.
      #
      # The first run of this workflow failed on
      # `Cannot find package 'express-rate-limit' imported from
      # src/server/utils/clientIp.js` — a gate importing server code, with the
      # server's dependencies never installed. It passed locally because this
      # workstation has `src/server/node_modules` from running the app.
      #
      # That is the whole reason to put the chain in CI: a clean checkout is the
      # only environment that tells you what your tests actually depend on.
      # `core-tests.yml` already installs here; this workflow simply did not know
      # it had to.
      - name: Install (src/server)
        working-directory: src/server
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run the gate chain
        run: npm test

  # ── The frontend must actually COMPILE ─────────────────────────────────────
  #
  # 🔴 Added 2026-08-16 because a JSX syntax error reached main and was found
  # only when the production Docker build failed, mid-deploy.
  #
  # Nothing in CI built the frontend. Every other job here reads source, runs
  # node tests, or hits a database — none of them parse a .tsx file. So
  # `{signedIn ? ( {/* comment */} <Link…>` — a comment placed where JSX does
  # not allow one — passed every gate and broke `docker compose build`.
  #
  # This runs the SAME command the image build runs (`npm run build` = vite +
  # prerender), because a gate that approximates the real build is a gate that
  # can disagree with it. It is the cheapest possible protection against the
  # entire class: any syntax error, bad import, or missing module in the
  # renderer now fails here instead of on the box, 30 minutes into a deploy
  # with the old container still serving and nobody sure why.
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same Windows-lockfile caveat as the gates job above.
      - name: Install (root)
        run: npm ci || npm install

      - name: Build the frontend exactly as the image does
        run: npm run build

      # The build is only half the claim. Prerender writes the product pages,
      # and a build that silently emits nothing would still exit 0.
      - name: Assert the build produced a real bundle
        run: |
          test -d dist || { echo "no dist/ — the build produced nothing"; exit 1; }
          count=$(find dist/assets -name 'index-*.js' | wc -l)
          test "$count" -ge 1 || { echo "dist/assets has no index bundle"; exit 1; }
          echo "dist/ contains $count index bundle(s)"

  # ── The Forum's end-to-end proofs ───────────────────────────────────────────
  #
  # Separate job because it needs a database, and because it must be possible to
  # read "the gates are green but the Forum proofs are red" as two different
  # facts. A single job that mixes source checks with a live-system check tells
  # you less than two jobs that each mean one thing.
  forum-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: forum_proofs
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BOTH installs. The proofs live at the repo ROOT (scripts/*.mjs) and import
      # `pg` from there; the services they drive live in src/server and import
      # theirs from there. Installing only one leaves the other unresolvable —
      # which is the same shape as the express-rate-limit failure on this
      # workflow's first run, in the other direction.
      - name: Install (root)
        run: npm ci || npm install

      - name: Install (src/server)
        working-directory: src/server
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run the Forum proofs against a fresh database
        working-directory: src/server
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/forum_proofs
        run: node tests/forum-proofs-ci.mjs
