# Money-path gate (Blocker #7 INFRA-7.5).
#
# Runs the credit-ledger / billing / media-metering test suites against a real Postgres,
# each in a FRESH database (the same isolation used on the box). These are the tests that
# guard the double-entry ledger, hash-chained journal, atomic money-in, refund/clawback,
# and the metered media hold→settle path — i.e. anything that can mis-charge a customer.
#
# NOTE: the org's hosted GitHub Actions may be billing-disabled; this workflow is
# version-controlled and auto-activates when billing is restored. Until then it can be run
# on demand (workflow_dispatch), on a self-hosted runner, or locally — the exact per-test
# loop below works verbatim with any DATABASE_URL.
name: money-tests

on:
  push:
    branches: ['**']
    paths:
      - 'src/server/utils/creditLedgerV2.js'
      - 'src/server/utils/creditTransactions.js'
      - 'src/server/utils/inferenceMeter.js'
      - 'src/server/utils/watermark.js'
      - 'src/server/services/billingService.js'
      - 'src/server/services/walletService.js'
      - 'src/server/services/migrationRunner.js'
      - 'src/server/routes/billingRoutes.js'
      - 'src/server/database/migrate-account-v2.js'
      - 'src/server/tests/**'
      - '.github/workflows/money-tests.yml'
  pull_request:
    paths:
      - 'src/server/**'
  workflow_dispatch: {}

jobs:
  money-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: src/server
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run money-path suites (fresh DB per suite)
        working-directory: src/server
        run: |
          set -euo pipefail
          # ledger-owner-kind pins the "a wallet's owner_kind is never inferred" contract
          # (a mis-typed workspace wallet permanently wedges ensureWorkspaceWallet).
          # migration-runner pins migration checksum recording + the rollback path; it is
          # destructive by design and relies on the fresh-DB-per-suite isolation below.
          #
          # 2026-08-03: added service-ledger + ledger-audit-fixes. Both already existed in
          # src/server/tests/ and were run by NO gate at all:
          #   • service-ledger      — the ONLY test of routes/serviceLedgerRoutes.js, the
          #     shared-LEDGER_SERVICE_TOKEN surface that xeno-agents-api bills real money
          #     through (token gate fail-closed, hold/settle/void, 402, replay idempotency).
          #     It needs NO extra CI secret: the suite sets LEDGER_SERVICE_TOKEN itself.
          #   • ledger-audit-fixes  — the regression gate for the 2026-07-19 money defects
          #     (video-render charging, saga compensation as a reversing entry, plan
          #     resolution, is_frozen plumbing, grant replay, in-house daily limit).
          # Verified green against postgres:15-alpine before wiring:
          # service-ledger 15/0, ledger-audit-fixes 41/0.
          #
          # Deliberately NOT here: credit-mirror-drift. It is a live-DATA probe, so on a
          # fresh CI database it passes vacuously, and against these suites' databases it
          # fails by design (ledger-audit-fixes poisons users.credits on purpose to prove
          # the mirror is not the decision input). See tests/suite-coverage.test.mjs.
          SUITES="ledger-v2 ledger-chain ledger-billing ledger-correctness billing-money-in media-metering wallet-service ledger-owner-kind migration-runner service-ledger ledger-audit-fixes"
          fail=0
          for t in $SUITES; do
            db="t_${t//-/_}"
            echo "──────── $t ($db) ────────"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $db"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
            if ! DATABASE_URL="postgresql://postgres:test@localhost:5432/$db" node "tests/${t}.test.mjs"; then
              echo "::error::money suite failed: $t"
              fail=1
            fi
          done
          exit $fail
