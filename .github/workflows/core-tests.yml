# Core-path gate — auth / authorization / privacy.
#
# Companion to money-tests.yml. Runs the hermetic auth-core suites that already exist
# but were wired to NO gate: ReBAC authorization (authz-v2), the OIDC provider (oidc-v2),
# GDPR erasure (erasure), and the AI tool-passthrough contract (ai-tools-passthrough).
# Each DB suite self-seeds via migrate-account-v2 and runs in a FRESH database, exactly
# like the money suites and like running them by hand on the box.
#
# Verified green on the box before wiring (2026-07-14): authz-v2 12/0, oidc-v2 18/0,
# erasure 6/0, ai-tools-passthrough 6/0.
#
# 2026-07-25: added the token-confusion gate (auth-token-confusion) + the API-key auth
# suite, and made middleware/auth.js + middleware/oidcAuth.js trigger paths — the
# Bearer-resolution path had NO gate at all, which is how the missing `aud`/`typ`
# verification reached production. Re-verified locally against postgres:15-alpine
# (counts below are the measured ones): auth-token-confusion 28/0 — and 21/28 with 7
# FAILURES when middleware/auth.js alone is reverted to its pre-fix version, i.e. the
# ID token and the back-channel logout token both authenticate. It is a real
# regression gate, not a tautology. Also api-key-auth 12/0, authz-v2 23/0, oidc-v2
# 18/0, erasure 7/0, account-recovery 36/0, entitlement-gate 26/0,
# ai-tools-passthrough 6/0.
#
# CAVEAT — api-key-auth on WINDOWS: all 12 assertions pass, then node aborts during
# process teardown with a libuv assertion (`!(handle->flags & UV_HANDLE_CLOSING)`,
# src\win\async.c) → exit 127. Pre-existing, unrelated to auth logic, and NOT
# reproduced on Linux — harmless on `ubuntu-latest`, but it WOULD red-wall this job
# if these suites are ever moved to a self-hosted Windows runner. Fix the suite's
# teardown before any such migration.
#
# !! THIS GATE IS CURRENTLY INERT — VERIFIED 2026-07-25, DO NOT ASSUME IT PROTECTS YOU.
# This job targets GitHub-hosted `ubuntu-latest`, and org-wide hosted Actions billing is
# dead. Pushing this branch produced run 30150986315 / 30150965339: BOTH jobs failed in
# ~1 second having executed ZERO steps, annotation verbatim —
#   "The job was not started because recent account payments have failed or your
#    spending limit needs to be increased."
# (This repo's last GREEN core-tests/money-tests runs are 2026-07-22; they predate the
# billing failure. A green run older than that date proves nothing about today.)
#
# So the suites below are only actually enforced by running them LOCALLY. Until billing
# is restored, this file is documentation, not a gate.
#
# Porting it to the self-hosted runner (`[self-hosted, windows, xeno]`, the only lane
# private repos have) is NOT a drop-in `runs-on:` swap — four things break:
#   1. `services: postgres` — service containers are not available on a Windows runner.
#      The suites need a real Postgres; something has to provision one.
#   2. `sudo apt-get install postgresql-client` — Linux-only; `psql` must come from
#      elsewhere (the suites shell out to it to create a fresh DB per suite).
#   3. The `run:` blocks are bash (`set -euo pipefail`) and need an explicit
#      `shell: bash`; the runner has PowerShell 5.1, not pwsh.
#   4. `api-key-auth` aborts on Windows (see the caveat above) → guaranteed red.
# Each is solvable, but it is real work with a queue-starvation risk on the single
# shared runner — deliberately not attempted as a side effect of the auth fix.
name: core-tests

on:
  push:
    branches: ['**']
    paths:
      - 'src/server/middleware/auth.js'
      - 'src/server/middleware/oidcAuth.js'
      - 'src/server/utils/authzReBAC.js'
      - 'src/server/utils/oidcProvider.js'
      - 'src/server/utils/gdprErasure.js'
      - 'src/server/utils/xenoChat.js'
      - 'src/server/utils/entitlementGate.js'
      - 'src/server/database/migrate-account-v2.js'
      - 'src/server/tests/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'src/server/**'
  workflow_dispatch: {}

jobs:
  core-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: src/server
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run DB-backed core suites (fresh DB per suite)
        working-directory: src/server
        run: |
          set -euo pipefail
          SUITES="authz-v2 oidc-v2 erasure account-recovery auth-token-confusion api-key-auth"
          fail=0
          for t in $SUITES; do
            db="c_${t//-/_}"
            echo "──────── $t ($db) ────────"
            psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS $db"
            psql -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
            if ! DATABASE_URL="postgresql://postgres:test@localhost:5432/$db" node "tests/${t}.test.mjs"; then
              echo "::error::core suite failed: $t"
              fail=1
            fi
          done
          exit $fail

      - name: Run no-DB core suites (tool passthrough, entitlement gate)
        working-directory: src/server
        run: |
          set -euo pipefail
          XENO_API_KEY=test node tests/ai-tools-passthrough.test.mjs
          node tests/entitlement-gate.test.mjs

  # Advisory typecheck — NOT blocking yet. `strict:true` was never enforced (vite/esbuild
  # strips types), so the fallout is unknown/likely large; this surfaces the errors in CI
  # without red-walling every PR. Make it blocking once the fallout is triaged (roadmap
  # Phase 2/5, docs/PLATFORM-MODERNIZATION.md). TypeScript is installed ephemerally because
  # it is not (yet) a committed devDependency.
  typecheck-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck (advisory)
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx --yes typescript@5.6 tsc -p tsconfig.app.json --noEmit || {
            echo "::warning::typecheck reported errors (advisory — not failing the build)";
            exit 0;
          }
