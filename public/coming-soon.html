<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>XENOsystem — Coming soon</title>
  <link rel="icon" href="/favicon-v2.svg" type="image/svg+xml">
  <!-- The site gate's page (routes/siteGateRoutes.js, nginx `location = /coming-soon.html`). Self-contained on
       purpose: it must render with nothing else from the site, so it reveals nothing about the products behind the
       gate. The code form posts to /api/site-gate/unlock, which sets the signed gate cookie; the page then reloads
       and the gate lets the visitor through. The code opens PAGES only - /api/ still needs a real account.
       Visual standard: XENOsystem Home v21 (owner, 2026-10-22) — its grey ramp, plate, radius and type,
       restated here because this page may not load the site's assets. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060606; --plate: #090909; --panel: #0f0f0f; --line: #1e1e1e; --line2: #2a2a2a;
      --ink: #e6e6e6; --ink2: #c6c6c6; --dim: #8f8f8f; --faint: #6a6a6a;
      --acc: #d9d9d9; --acc-ink: #0b0b0b; --err: #d08a72;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink2);
      font: 15px/1.6 'IBM Plex Sans', Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; min-height: 100dvh;
    }
    ::selection { background: rgba(217,217,217,.25); }
    header {
      flex: none; display: flex; align-items: center; gap: 20px; height: 60px;
      padding: 0 clamp(16px, 2vw, 28px);
      background: rgba(6,6,6,.88); border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
    .brand svg { display: block; width: 24px; height: 24px; }
    .brand span { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    header .sp { flex: 1; }
    a.btn, button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line2);
      background: var(--panel); color: var(--ink); text-decoration: none;
      font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    a.btn:hover, button:hover { background: #1a1a1a; color: #fff; }
    a.btn.primary, button.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); font-weight: 600; }
    a.btn.primary:hover, button.primary:hover { background: #fff; color: var(--acc-ink); }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 2px solid rgba(217,217,217,.55); outline-offset: 2px;
    }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px 40px;
    }
    .plate {
      width: 100%; max-width: 440px; padding: clamp(28px, 5vw, 40px);
      background: var(--plate); border: 1px solid var(--line); border-radius: 10px;
      text-align: center;
    }
    .plate .mark { display: flex; justify-content: center; color: var(--ink); }
    .plate .mark svg { width: 34px; height: 34px; }
    .eyebrow {
      margin: 22px 0 10px; font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
    }
    h1 {
      margin: 0 0 12px; color: var(--ink); font-weight: 600;
      font-size: clamp(30px, 6vw, 38px); line-height: 1.05; letter-spacing: -.02em;
    }
    p { margin: 0 0 28px; font-size: 15.5px; color: var(--ink2); }
    .plate a.btn { height: 40px; padding: 0 20px; }
    .code { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
    .code summary {
      cursor: pointer; color: var(--dim); font-size: 13.5px; list-style: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .code summary::-webkit-details-marker { display: none; }
    .code summary:hover { color: var(--ink); }
    .code form { display: flex; gap: 8px; margin-top: 16px; }
    /* Focus is the border brightening — never an extra outline floating outside the field. */
    .code input {
      flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 7px;
      border: 1px solid var(--line2); background: var(--panel); color: var(--ink);
      font: inherit; font-size: 14px; outline: none;
      transition: border-color .15s ease;
    }
    .code input::placeholder { color: var(--faint); }
    .code input:focus { border-color: #8f8f8f; }
    .code button { height: 40px; padding: 0 16px; }
    .code button:disabled { opacity: .6; cursor: default; }
    .err { min-height: 20px; margin: 10px 0 0; font-size: 13px; color: var(--err); }
    .err:empty { margin: 0; }
    footer {
      flex: none; padding: 20px 16px 24px; text-align: center;
      font-size: 12.5px; color: var(--faint);
    }
    footer a { color: var(--faint); text-decoration: none; }
    footer a:hover { color: var(--ink2); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="XENOsystem home">
      <svg viewBox="0 0 1082 1082" aria-hidden="true"><g fill="currentColor"><path d="M 475.75 222.25 L 302.75 49.25 L 80.75 49.25 A 59.5 59.5 0 0 0 21.25 108.75 L 21.25 332.25 L 352.75 663.75 L 475.75 540.75 L 231.25 296.25 C 195.641375 260.641375 209.722 254.75 221.25 254.75 L 443.25 254.75 Z"></path><path d="M 859.75 475.75 L 1032.75 302.75 L 1032.75 80.75 A 59.5 59.5 0 0 0 973.25 21.25 L 749.75 21.25 L 418.25 352.75 L 541.25 475.75 L 785.75 231.25 C 821.358625 195.641375 827.25 209.722 827.25 221.25 L 827.25 443.25 Z"></path><path d="M 606.25 859.75 L 779.25 1032.75 L 1001.25 1032.75 A 59.5 59.5 0 0 0 1060.75 973.25 L 1060.75 749.75 L 729.25 418.25 L 606.25 541.25 L 850.75 785.75 C 886.358625 821.358625 872.278 827.25 860.75 827.25 L 638.75 827.25 Z"></path><path d="M 222.25 606.25 L 49.25 779.25 L 49.25 1001.25 A 59.5 59.5 0 0 0 108.75 1060.75 L 332.25 1060.75 L 663.75 729.25 L 540.75 606.25 L 296.25 850.75 C 260.641375 886.358625 254.75 872.278 254.75 860.75 L 254.75 638.75 Z"></path></g></svg>
      <span>XENOsystem</span>
    </a>
    <div class="sp"></div>
    <a class="btn" href="/login">Sign in</a>
  </header>
  <main>
    <div class="plate">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 1082 1082"><g fill="currentColor"><path d="M 475.75 222.25 L 302.75 49.25 L 80.75 49.25 A 59.5 59.5 0 0 0 21.25 108.75 L 21.25 332.25 L 352.75 663.75 L 475.75 540.75 L 231.25 296.25 C 195.641375 260.641375 209.722 254.75 221.25 254.75 L 443.25 254.75 Z"></path><path d="M 859.75 475.75 L 1032.75 302.75 L 1032.75 80.75 A 59.5 59.5 0 0 0 973.25 21.25 L 749.75 21.25 L 418.25 352.75 L 541.25 475.75 L 785.75 231.25 C 821.358625 195.641375 827.25 209.722 827.25 221.25 L 827.25 443.25 Z"></path><path d="M 606.25 859.75 L 779.25 1032.75 L 1001.25 1032.75 A 59.5 59.5 0 0 0 1060.75 973.25 L 1060.75 749.75 L 729.25 418.25 L 606.25 541.25 L 850.75 785.75 C 886.358625 821.358625 872.278 827.25 860.75 827.25 L 638.75 827.25 Z"></path><path d="M 222.25 606.25 L 49.25 779.25 L 49.25 1001.25 A 59.5 59.5 0 0 0 108.75 1060.75 L 332.25 1060.75 L 663.75 729.25 L 540.75 606.25 L 296.25 850.75 C 260.641375 886.358625 254.75 872.278 254.75 860.75 L 254.75 638.75 Z"></path></g></svg>
      </div>
      <div class="eyebrow">Private preview</div>
      <h1>Coming soon.</h1>
      <p>XENOsystem is open to invited people for now.</p>
      <a class="btn primary" href="/login">Sign in</a>

      <details class="code" id="codebox">
        <summary>Have an access code?</summary>
        <form id="f" novalidate>
          <input id="c" name="code" type="text" placeholder="Access code" autocomplete="off"
                 autocapitalize="off" spellcheck="false" aria-label="Access code" required>
          <button id="b" type="submit">Continue</button>
        </form>
        <p class="err" id="e" role="status" aria-live="polite"></p>
      </details>
    </div>
  </main>
  <footer><a href="/impressum">Impressum</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
  <script>
    (function () {
      var form = document.getElementById('f');
      var input = document.getElementById('c');
      var button = document.getElementById('b');
      var error = document.getElementById('e');
      var MESSAGES = {
        invalid_code: 'That code is not right.',
        too_many_attempts: 'Too many attempts. Try again in a few minutes.',
        no_access_code: 'This site is invitation only right now. Ask for access.',
        default: 'Could not check that code. Try again.',
      };
      function unlock(code) {
        if (!code || button.disabled) return;
        button.disabled = true;
        error.textContent = '';
        // Signed in already (an account without access)? Then /api/ checks the session's CSRF pair on this POST,
        // exactly as it does for the app; send the readable half, or the code is refused with "CSRF validation failed".
        var csrf = (document.cookie.match(/(?:^|;\s*)(?:__Host-)?xeno_csrf=([^;]+)/) || [])[1];
        var headers = { 'content-type': 'application/json' };
        if (csrf) headers['x-xeno-csrf'] = decodeURIComponent(csrf);
        fetch('/api/site-gate/unlock', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ code: code }),
          credentials: 'same-origin',
        }).then(function (r) {
          if (r.ok) { window.location.replace('/'); return null; } // 204 shared code, 200 a personal code
          return r.json().catch(function () { return {}; }).then(function (body) {
            error.textContent = MESSAGES[body.error] || MESSAGES.default;
            button.disabled = false;
          });
        }).catch(function () {
          error.textContent = MESSAGES.default;
          button.disabled = false;
        });
      }
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        unlock(input.value.trim());
      });
      // The shareable entry: xenosystem.ai/access (nginx sends it to
      // /?access=1) opens the code form instead of leaving it folded, and
      // a link carrying the code (xenosystem.ai/?code=XXXX, the form people
      // are sent) fills it in and unlocks straight away. The check itself
      // is the same POST /unlock as typing it - no second door.
      var linked = new URLSearchParams(window.location.search).get('code');
      if (linked || new URLSearchParams(window.location.search).has('access') || window.location.hash === '#access') {
        document.getElementById('codebox').open = true;
      }
      if (linked) { input.value = linked; unlock(linked.trim()); }
    })();
  </script>
</body>
</html>
