services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: xenostudio-postgres
    environment:
      - POSTGRES_DB=xenostudio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: xenostudio-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xenostudio-backend
    environment:
      - NODE_ENV=production
      # OIDC provider (Sign in with XENO). Mounts /api/oauth2/* — off by default;
      # clients live in the oauth_clients DB table (xeno-post, xeno-api-portal).
      - OIDC_ENABLED=true
      # v2 credit ledger. These two lines existed ONLY on xeno-platform-001 and were
      # never committed — found 2026-07-30 while reconciling the box against main.
      # The box is 231 commits behind, and a `git reset --hard origin/main` to catch
      # it up would have silently deleted both: the ledger flag would have flipped
      # off and the service token would have gone unset, on the system that meters
      # money. Committing them is the prerequisite for that reset being safe.
      # LEDGER_SERVICE_TOKEN is supplied from the box's .env; nothing secret here.
      - LEDGER_V2_ENABLED=true
      - LEDGER_SERVICE_TOKEN=${LEDGER_SERVICE_TOKEN}
      - BACKEND_PORT=8080
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=xenostudio
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/xenostudio
      # Docker socket mounted below for container provisioning
      - STORAGE_LIMIT_GB=5
      - CONVERSION_RETENTION_DAYS=7
      # XENO-API-only: no third-party provider keys. All inference → api.xenostudio.ai (XENO_API_KEY).
      - XENO_API_KEY=${XENO_API_KEY}
      - XENO_REMOTE_RUNNER_COMMAND=${XENO_REMOTE_RUNNER_COMMAND}
      - XENO_REMOTE_RUNNER_ARGS_JSON=${XENO_REMOTE_RUNNER_ARGS_JSON}
      - XENO_REMOTE_RUNNER_CWD=${XENO_REMOTE_RUNNER_CWD}
      - XENO_REMOTE_RUNNER_MAX_CONCURRENT=${XENO_REMOTE_RUNNER_MAX_CONCURRENT}
      - XENO_REMOTE_RUNNER_AUTOSCALE=${XENO_REMOTE_RUNNER_AUTOSCALE}
      - XENO_REMOTE_RUNNER_AUTOSCALE_MIN=${XENO_REMOTE_RUNNER_AUTOSCALE_MIN}
      - XENO_REMOTE_RUNNER_AUTOSCALE_MAX=${XENO_REMOTE_RUNNER_AUTOSCALE_MAX}
      - XENO_REMOTE_RUNNER_TIMEOUT_MS=${XENO_REMOTE_RUNNER_TIMEOUT_MS}
      - XENO_REMOTE_RUNNER_RETENTION=${XENO_REMOTE_RUNNER_RETENTION}
      - XENO_REMOTE_RUNNER_MAX_PROMPT_CHARS=${XENO_REMOTE_RUNNER_MAX_PROMPT_CHARS}
      - XENO_REMOTE_RUNNER_MAX_EVENT_TEXT_CHARS=${XENO_REMOTE_RUNNER_MAX_EVENT_TEXT_CHARS}
      - XENO_REMOTE_RUNNER_ENV_ALLOWLIST=${XENO_REMOTE_RUNNER_ENV_ALLOWLIST}
      - XENO_REMOTE_RUNNER_API_KEY_ENV=${XENO_REMOTE_RUNNER_API_KEY_ENV}
      - EXTENSION_RELEASES_REPO=${EXTENSION_RELEASES_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - EXTENSION_CHROME_STABLE_URL=${EXTENSION_CHROME_STABLE_URL}
      - EXTENSION_CHROME_BETA_URL=${EXTENSION_CHROME_BETA_URL}
      - EXTENSION_CHROME_PREVIEW_URL=${EXTENSION_CHROME_PREVIEW_URL}
      - EXTENSION_EDGE_STABLE_URL=${EXTENSION_EDGE_STABLE_URL}
      - EXTENSION_EDGE_BETA_URL=${EXTENSION_EDGE_BETA_URL}
      - EXTENSION_EDGE_PREVIEW_URL=${EXTENSION_EDGE_PREVIEW_URL}
      - EXTENSION_SAFARI_STABLE_URL=${EXTENSION_SAFARI_STABLE_URL}
      - EXTENSION_SAFARI_BETA_URL=${EXTENSION_SAFARI_BETA_URL}
      - EXTENSION_SAFARI_PREVIEW_URL=${EXTENSION_SAFARI_PREVIEW_URL}
      - BROWSERLESS_URL=http://browserless:3000
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI}
      # OAuth - GitHub
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      # OAuth - Twitter/X
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      # JWT & Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
      # Setup/migration gate + admin seed (unset by default -> /init & /migrate fail closed in prod)
      - SETUP_TOKEN=${SETUP_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_FRONTEND_URL=${AUTH_FRONTEND_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - XENO_FLOW_URL=http://host.docker.internal:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/server/uploads:/app/uploads
      - ./src/server/sam2-uploads:/app/sam2-uploads
      - ./src/server/storage:/app/storage
      - ./conversions:/app/conversions
      - /var/run/docker.sock:/var/run/docker.sock
      # Video Studio storage
      - ./storage/videos:/app/storage/videos
      - ./storage/thumbnails:/app/storage/thumbnails
      - ./storage/assets:/app/storage/assets
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/ready', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Proxy Server for external APIs (commented out - no Dockerfile)
  # proxy:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.proxy
  #   container_name: xenostudio-proxy
  #   environment:
  #     - PORT=4001
  #   ports:
  #     - "4001:4001"
  #   networks:
  #     - xenostudio-network
  #   restart: unless-stopped

  # Xeno Search Service - AI-powered search and analysis
  xeno-search:
    build:
      context: ../xeno-search-service
      dockerfile: Dockerfile
      target: production
    container_name: xenostudio-xeno-search
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      - SERVICE_NAME=xeno-search-service
      - SERVICE_VERSION=2.0.0
      - ENVIRONMENT=production
      # Use the shared Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/1
      - CACHE_ENABLED=true
      - CACHE_TYPE=redis
      # Rate limiting (disabled due to middleware compatibility)
      - RATE_LIMITING_ENABLED=false
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - RATE_LIMIT_REQUESTS_PER_HOUR=1000
      # Auth disabled for internal use
      - AUTH_ENABLED=false
      # Logging
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json
      # Search configuration - Add your API keys here!
      - SEARXNG_INSTANCE_URL=https://searx.tiekoetter.com
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # Google Custom Search (get from https://developers.google.com/custom-search)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CX=${GOOGLE_CX:-}
      # Bing Search (get from https://azure.microsoft.com/en-us/services/cognitive-services/bing-web-search-api/)
      - BING_API_KEY=${BING_API_KEY:-}
      # NLP/ML configuration
      - SUMMARIZATION_MODEL=sshleifer/distilbart-cnn-12-6
      - ENABLE_SEMANTIC_SEARCH=true
      # CORS - allow from frontend and backend (JSON format for pydantic-settings v2)
      - CORS_ORIGINS=["http://backend:8080","https://xenostudio.ai"]
      # Meilisearch configuration (for Xeno Search Engine)
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required}
    volumes:
      - xeno_search_cache:/app/.cache
      - xeno_search_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_started
      meilisearch:
        condition: service_healthy
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # XenoRun Code Execution Engine
  xenorun:
    build:
      context: ../xenorun
      dockerfile: Dockerfile
    container_name: xenostudio-xenorun
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LaTeX Compilation Service (Full TeX Live)
  latex:
    build:
      context: .
      dockerfile: Dockerfile.latex
    container_name: xenostudio-latex
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NON-SECRET build args only — provider API keys are never baked into the
        # frontend image; all inference routes through the authed, metered backend.
        - VITE_API_URL=/api
        - VITE_WS_URL=wss://xenostudio.ai/ws
        - VITE_ENABLE_SITE_GATE=${VITE_ENABLE_SITE_GATE}
        - VITE_SITE_PASSWORD=${VITE_SITE_PASSWORD}
    container_name: xenostudio-frontend
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:8080
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "127.0.0.1:4040:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && wget -qO- http://127.0.0.1/health >/dev/null && wget -qO- http://127.0.0.1/api/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Gateway (commented out - no Dockerfile)
  # websocket:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.websocket
  #   container_name: xenostudio-websocket
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #     - POSTGRES_URL=postgresql://postgres:xenostudio_secure_2024@postgres:5432/xenostudio
  #   ports:
  #     - "4003:8081"
  #   depends_on:
  #     - redis
  #     - postgres
  #   networks:
  #     - xenostudio-network
  #   restart: unless-stopped

  # File Storage Service (commented out - no Dockerfile)
  # storage:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.storage
  #   container_name: xenostudio-storage
  #   environment:
  #     - POSTGRES_URL=postgresql://postgres:xenostudio_secure_2024@postgres:5432/xenostudio
  #   volumes:
  #     - ./xenoos-user-data:/data/users
  #     - ./xenoos-shared:/data/shared
  #     - ./xenoos-cloud-storage:/data/cloud
  #   ports:
  #     - "8082:8082"
  #   depends_on:
  #     - postgres
  #   networks:
  #     - xenostudio-network
  #   restart: unless-stopped

  # Xeno Browser - KasmVNC Chrome for embedded browsing
  xeno-browser:
    image: kasmweb/chrome:1.16.0
    container_name: xenostudio-xeno-browser
    environment:
      - VNC_PW=${VNC_PW:?VNC_PW required}
      - VNC_RESOLUTION=1920x1080
      - VNC_COL_DEPTH=24
    shm_size: "1gb"
    ports:
      - "127.0.0.1:6901:6901"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:6901 | grep -qE '200|401|302'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Browserless - Headless Chrome API for AI browser automation
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: xenostudio-browserless
    environment:
      - TOKEN=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}
      - CONCURRENT=5
      - QUEUED=10
      - TIMEOUT=120000
      - HEALTH=true
      - ENABLE_DEBUGGER=false
      - ENABLE_CORS=true
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/config?token=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Meilisearch - Fast search index for Xeno Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: xenostudio-meilisearch
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  xeno_search_cache:
    driver: local
  xeno_search_logs:
    driver: local
  meilisearch_data:
    driver: local

networks:
  xenostudio-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
