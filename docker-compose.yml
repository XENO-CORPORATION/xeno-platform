  # Xeno Browser - KasmVNC Chrome for embedded browsing
  xeno-browser:
    image: kasmweb/chrome:1.16.0
    container_name: xenostudio-xeno-browser
    environment:
      - VNC_PW=${VNC_PW:?VNC_PW required}
      - VNC_RESOLUTION=1920x1080
      - VNC_COL_DEPTH=24
    shm_size: "1gb"
    ports:
      - "127.0.0.1:6901:6901"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:6901 | grep -qE '200|401|302'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Browserless - Headless Chrome API for AI browser automation
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: xenostudio-browserless
    environment:
      - TOKEN=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}
      - CONCURRENT=5
      - QUEUED=10
      - TIMEOUT=120000
      - HEALTH=true
      - ENABLE_DEBUGGER=false
      - ENABLE_CORS=true
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/config?token=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Meilisearch - Fast search index for Xeno Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: xenostudio-meilisearch
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  xeno_search_cache:
    driver: local
  xeno_search_logs:
    driver: local
  meilisearch_data:
    driver: local
  chat_extractor_jobs:
    driver: local

networks:
  xenostudio-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
