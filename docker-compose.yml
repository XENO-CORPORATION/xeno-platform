services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    container_name: xenostudio-postgres
    environment:
      - POSTGRES_DB=xenostudio
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: xenostudio-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xenostudio-backend
    environment:
      - NODE_ENV=production
      # OIDC provider (Sign in with XENO). Mounts /api/oauth2/* — off by default;
      # clients live in the oauth_clients DB table (xeno-post, xeno-api-portal).
      - OIDC_ENABLED=true
      # v2 credit ledger. These two lines existed ONLY on xeno-platform-001 and were
      # never committed — found 2026-07-30 while reconciling the box against main.
      # The box is 231 commits behind, and a `git reset --hard origin/main` to catch
      # it up would have silently deleted both: the ledger flag would have flipped
      # off and the service token would have gone unset, on the system that meters
      # money. Committing them is the prerequisite for that reset being safe.
      # LEDGER_SERVICE_TOKEN is supplied from the box's .env; nothing secret here.
      - LEDGER_V2_ENABLED=true
      # At-rest encryption for stored OAuth tokens (src/server/utils/secretBox.js).
      # secretBox is FAIL-CLOSED: without this the backend refuses to write a
      # token rather than silently storing plaintext, so a missing passthrough
      # here breaks channel connection loudly instead of quietly regressing.
      # ⚠ Losing the value makes every sealed token unrecoverable.
      - SECRET_BOX_KEY=${SECRET_BOX_KEY}
      # Per-product inference routing + the provider-key vault
      # (`XENO INFERENCE ROUTING - SPEC.md`). FAILS CLOSED: anything other than
      # the exact string "true" — unset, empty, "TRUE", "1" — leaves BYOK off and
      # /api/ai/chat behaving exactly as it does today.
      #
      # Declared here rather than only in the box's .env ON PURPOSE. The two
      # lines above this block existed ONLY on xeno-platform-001 for months and
      # a `git reset --hard` would have silently unset them. A flag that governs
      # customer credentials must not be able to vanish the same way.
      - BYOK_ENABLED=${BYOK_ENABLED:-}
      - INFERENCE_GRANT_TOKEN=${INFERENCE_GRANT_TOKEN:-}
      - LEDGER_SERVICE_TOKEN=${LEDGER_SERVICE_TOKEN}
      - BACKEND_PORT=8080
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=xenostudio
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/xenostudio
      # Docker socket mounted below for container provisioning
      - STORAGE_LIMIT_GB=5
      - CONVERSION_RETENTION_DAYS=7
      # XENO-API-only: no third-party provider keys. All inference → api.xenostudio.ai (XENO_API_KEY).
      - XENO_API_KEY=${XENO_API_KEY}
      - XENO_EMBEDDING_BASE_URL=${XENO_EMBEDDING_BASE_URL:-}
      - XENO_EMBEDDING_API_KEY=${XENO_EMBEDDING_API_KEY:-}
      - XENO_EMBEDDING_TIMEOUT_MS=${XENO_EMBEDDING_TIMEOUT_MS:-10000}
      - XENO_EMBEDDING_HEALTH_TIMEOUT_MS=${XENO_EMBEDDING_HEALTH_TIMEOUT_MS:-2000}
      - XENO_REMOTE_RUNNER_COMMAND=${XENO_REMOTE_RUNNER_COMMAND}
      - XENO_REMOTE_RUNNER_ARGS_JSON=${XENO_REMOTE_RUNNER_ARGS_JSON}
      - XENO_REMOTE_RUNNER_CWD=${XENO_REMOTE_RUNNER_CWD}
      - XENO_REMOTE_RUNNER_MAX_CONCURRENT=${XENO_REMOTE_RUNNER_MAX_CONCURRENT}
      - XENO_REMOTE_RUNNER_AUTOSCALE=${XENO_REMOTE_RUNNER_AUTOSCALE}
      - XENO_REMOTE_RUNNER_AUTOSCALE_MIN=${XENO_REMOTE_RUNNER_AUTOSCALE_MIN}
      - XENO_REMOTE_RUNNER_AUTOSCALE_MAX=${XENO_REMOTE_RUNNER_AUTOSCALE_MAX}
      - XENO_REMOTE_RUNNER_TIMEOUT_MS=${XENO_REMOTE_RUNNER_TIMEOUT_MS}
      - XENO_REMOTE_RUNNER_RETENTION=${XENO_REMOTE_RUNNER_RETENTION}
      - XENO_REMOTE_RUNNER_MAX_PROMPT_CHARS=${XENO_REMOTE_RUNNER_MAX_PROMPT_CHARS}
      - XENO_REMOTE_RUNNER_MAX_EVENT_TEXT_CHARS=${XENO_REMOTE_RUNNER_MAX_EVENT_TEXT_CHARS}
      - XENO_REMOTE_RUNNER_ENV_ALLOWLIST=${XENO_REMOTE_RUNNER_ENV_ALLOWLIST}
      - XENO_REMOTE_RUNNER_API_KEY_ENV=${XENO_REMOTE_RUNNER_API_KEY_ENV}
      - EXTENSION_RELEASES_REPO=${EXTENSION_RELEASES_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - EXTENSION_CHROME_STABLE_URL=${EXTENSION_CHROME_STABLE_URL}
      - EXTENSION_CHROME_BETA_URL=${EXTENSION_CHROME_BETA_URL}
      - EXTENSION_CHROME_PREVIEW_URL=${EXTENSION_CHROME_PREVIEW_URL}
      - EXTENSION_EDGE_STABLE_URL=${EXTENSION_EDGE_STABLE_URL}
      - EXTENSION_EDGE_BETA_URL=${EXTENSION_EDGE_BETA_URL}
      - EXTENSION_EDGE_PREVIEW_URL=${EXTENSION_EDGE_PREVIEW_URL}
      - EXTENSION_SAFARI_STABLE_URL=${EXTENSION_SAFARI_STABLE_URL}
      - EXTENSION_SAFARI_BETA_URL=${EXTENSION_SAFARI_BETA_URL}
      - EXTENSION_SAFARI_PREVIEW_URL=${EXTENSION_SAFARI_PREVIEW_URL}
      - BROWSERLESS_URL=http://browserless:3000
      - BROWSERLESS_TOKEN=${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN required}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI}
      # OAuth - GitHub
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      # OAuth - Twitter/X
      - TWITTER_CLIENT_ID=${TWITTER_CLIENT_ID}
      - TWITTER_CLIENT_SECRET=${TWITTER_CLIENT_SECRET}
      - TWITTER_CALLBACK_URL=${TWITTER_CALLBACK_URL}
      # JWT & Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
      # Setup/migration gate + admin seed (unset by default -> /init & /migrate fail closed in prod)
      - SETUP_TOKEN=${SETUP_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AUTH_FRONTEND_URL=${AUTH_FRONTEND_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - XENO_FLOW_URL=http://host.docker.internal:8090
      # ── Settings that fail SILENTLY when absent ──────────────────────
      # 🔴 Every one of these was set in the box's .env on 2026-08-24 and reached
      # NO container, because the `${VAR}` line that reads it was never restored
      # after that file was overwritten. Measured 2026-08-24: signup answered 403
      # to everyone, outbound mail was dead, forum notifications were off and the
      # extension's CORS origin was unknown — for a day, with nothing logged as an
      # error, because each of these degrades quietly by design.
      #
      # ⚠️ A value in .env does NOT reach a container on its own. Compose reads
      # .env for ${} SUBSTITUTION only; without a line here the value is simply
      # never passed. That distinction is the whole bug.
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-}
      - REGISTRATION_OPEN_UNTIL=${REGISTRATION_OPEN_UNTIL:-}
      - REGISTRATION_ALLOWLIST=${REGISTRATION_ALLOWLIST:-}
      - FORUM_NOTIFICATION_EMAILS=${FORUM_NOTIFICATION_EMAILS:-}
      - XENO_EXTENSION_ORIGINS=${XENO_EXTENSION_ORIGINS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # ── Billing / Stripe ─────────────────────────────────────────────
      # 🔴 DECLARED HERE ON PURPOSE, all via ${VAR:-} so an unset one is empty
      # rather than a compose error. On 2026-08-24 this file was overwritten from
      # the repo and four box-only values were destroyed — signup closed for
      # everyone, forum email stopped, extension CORS broke, outbound mail died.
      # The durable fix is that VALUES live in the box's .env and NAMES live
      # here, so an overwrite can no longer erase a setting. Keep it that way:
      # never paste a literal secret into this file.
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_AUTOMATIC_TAX=${STRIPE_AUTOMATIC_TAX:-}
      # What the customer sees on their bank statement. An unrecognised line is
      # the most common cause of a "what is this?" chargeback.
      - STRIPE_STATEMENT_DESCRIPTOR=${STRIPE_STATEMENT_DESCRIPTOR:-}
      - BILLING_APP_URL=${BILLING_APP_URL:-}
      - BILLING_CURRENCY=${BILLING_CURRENCY:-}
      # Where dispute notifications go. Disputes are handled either way, but
      # Stripe sets a DEADLINE for evidence and an unanswered dispute is lost by
      # default. Falls back to billing@ — fine only if somebody reads it.
      - DISPUTE_ALERT_EMAIL=${DISPUTE_ALERT_EMAIL:-}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY:-}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL:-}
      - STRIPE_PRICE_STUDIO_MONTHLY=${STRIPE_PRICE_STUDIO_MONTHLY:-}
      - STRIPE_PRICE_TEAM_MONTHLY=${STRIPE_PRICE_TEAM_MONTHLY:-}
      - STRIPE_PRICE_TEAM_SEAT_MONTHLY=${STRIPE_PRICE_TEAM_SEAT_MONTHLY:-}
      - STRIPE_PRICE_TEAM_SEAT_ANNUAL=${STRIPE_PRICE_TEAM_SEAT_ANNUAL:-}
      - STRIPE_PRICE_EVERYTHING_MONTHLY=${STRIPE_PRICE_EVERYTHING_MONTHLY:-}
      - STRIPE_PRICE_EVERYTHING_ANNUAL=${STRIPE_PRICE_EVERYTHING_ANNUAL:-}
      - STRIPE_PRICE_CREDITS_SMALL=${STRIPE_PRICE_CREDITS_SMALL:-}
      - STRIPE_PRICE_CREDITS_MEDIUM=${STRIPE_PRICE_CREDITS_MEDIUM:-}
      - STRIPE_PRICE_CREDITS_LARGE=${STRIPE_PRICE_CREDITS_LARGE:-}
      # ── Evidence retention ───────────────────────────────────────────
      # 🔴 Keys the one-way handle that lets consent evidence survive account
      # deletion (GDPR Art. 17(3)(e)). Unset, it falls back to JWT_SECRET — which
      # works until JWT_SECRET is rotated for an unrelated reason, silently
      # orphaning every consent record made before it. Set this BEFORE the first
      # sale; retiring a key later means listing the old value in
      # SUBJECT_HASH_SECRET_PREVIOUS (comma-separated) or matching stops working.
      - SUBJECT_HASH_SECRET=${SUBJECT_HASH_SECRET:-}
      - SUBJECT_HASH_SECRET_PREVIOUS=${SUBJECT_HASH_SECRET_PREVIOUS:-}
      # Per-account cap on download-grant minting (default 60/hour).
      - GRANT_HOURLY_CAP=${GRANT_HOURLY_CAP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/server/uploads:/app/uploads
      - ./src/server/uploads:/app/src/server/uploads
      - ./src/server/sam2-uploads:/app/sam2-uploads
      - ./src/server/storage:/app/storage
      - ./conversions:/app/conversions
      # Backups, READ-ONLY. Mounted solely so /api/health can report how old the
      # newest dump is — see the backup check in src/server/index.js. The nightly
      # backup failed silently for 15 days because nothing off-box could observe
      # it; this is the observation path. `:ro` because the API has no business
      # being able to modify or delete a backup.
      - ./backups:/app/backups:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Video Studio storage
      - ./storage/videos:/app/storage/videos
      - ./storage/thumbnails:/app/storage/thumbnails
      - ./storage/assets:/app/storage/assets
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/ready', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Untrusted document extraction has no network namespace. Requests and
  # bounded results cross a filesystem queue; source bytes are mounted read-only.
  chat-extractor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["npm", "run", "start:chat-extractor"]
    environment:
      - NODE_ENV=production
      - CHAT_EXTRACTOR_QUEUE_DIR=/app/extractor-jobs
      - CHAT_EXTRACTOR_INPUT_ROOTS=/app/uploads,/app/src/server/uploads,/app/storage
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ./src/server/uploads:/app/uploads:ro
      - ./src/server/uploads:/app/src/server/uploads:ro
      - ./src/server/storage:/app/storage:ro
      - chat_extractor_jobs:/app/extractor-jobs
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "const f=require('fs');const s=f.statSync('/app/extractor-jobs/heartbeat');process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # Durable Chat project workers. These are deliberately a separate process
  # from the API so scheduler/ingestion health and restarts are observable.
  chat-workers:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["npm", "run", "start:chat-workers"]
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=xenostudio
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/xenostudio
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379
      - XENO_API_KEY=${XENO_API_KEY}
      - SCHEDULED_RUN_TOKEN_SECRET=${SCHEDULED_RUN_TOKEN_SECRET:?SCHEDULED_RUN_TOKEN_SECRET required}
      - XENO_EMBEDDING_BASE_URL=${XENO_EMBEDDING_BASE_URL:-}
      - XENO_EMBEDDING_API_KEY=${XENO_EMBEDDING_API_KEY:-}
      - XENO_EMBEDDING_TIMEOUT_MS=${XENO_EMBEDDING_TIMEOUT_MS:-10000}
      - XENO_EMBEDDING_HEALTH_TIMEOUT_MS=${XENO_EMBEDDING_HEALTH_TIMEOUT_MS:-2000}
      - LEDGER_V2_ENABLED=true
      - LEDGER_SERVICE_TOKEN=${LEDGER_SERVICE_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - LIBRARY_CONTENT_SECRET=${LIBRARY_CONTENT_SECRET:-}
      - CHAT_WORKER_HEALTH_PORT=8081
      - CHAT_SCHEDULER_ENABLED=${CHAT_SCHEDULER_ENABLED:-0}
      - CHAT_INGESTION_ENABLED=${CHAT_INGESTION_ENABLED:-0}
      - CHAT_EXTRACTOR_MODE=filesystem-queue
      - CHAT_EXTRACTOR_QUEUE_DIR=/app/extractor-jobs
    volumes:
      - ./src/server/uploads:/app/uploads
      - ./src/server/uploads:/app/src/server/uploads
      - ./src/server/storage:/app/storage
      - chat_extractor_jobs:/app/extractor-jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      chat-extractor:
        condition: service_healthy
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # Proxy Server for external APIs (commented out - no Dockerfile)
  # proxy:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.proxy
  #   container_name: xenostudio-proxy
  #   environment:
  #     - PORT=4001
  #   ports:
  #     - "4001:4001"
  #   networks:
  #     - xenostudio-network
  #   restart: unless-stopped

  # Xeno Search Service - AI-powered search and analysis
  xeno-search:
    build:
      context: ../xeno-search-service
      dockerfile: Dockerfile
      target: production
    container_name: xenostudio-xeno-search
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      - SERVICE_NAME=xeno-search-service
      - SERVICE_VERSION=2.0.0
      - ENVIRONMENT=production
      # Use the shared Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/1
      - CACHE_ENABLED=true
      - CACHE_TYPE=redis
      # Rate limiting (disabled due to middleware compatibility)
      - RATE_LIMITING_ENABLED=false
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - RATE_LIMIT_REQUESTS_PER_HOUR=1000
      # Auth disabled for internal use
      - AUTH_ENABLED=false
      # Logging
      - LOGGING_LEVEL=INFO
      - LOGGING_FORMAT=json
      # Search configuration - Add your API keys here!
      - SEARCH_ENGINES=["duckduckgo","brave"]
      - BRAVE_SEARCH_API_KEY=${BRAVE_API_KEY:-}
      # Google Custom Search (get from https://developers.google.com/custom-search)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CX=${GOOGLE_SEARCH_CX:-}
      # Bing Search (get from https://azure.microsoft.com/en-us/services/cognitive-services/bing-web-search-api/)
      - BING_API_KEY=${BING_API_KEY:-}
      # NLP/ML configuration
      - SUMMARIZATION_MODEL=sshleifer/distilbart-cnn-12-6
      - SEMANTIC_SEARCH_ENABLED=true
      # CORS - allow from frontend and backend (JSON format for pydantic-settings v2)
      - CORS_ORIGINS=["http://backend:8080","https://xenostudio.ai"]
      # Meilisearch configuration (for Xeno Search Engine)
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY required}
    volumes:
      - xeno_search_cache:/app/.cache
      - xeno_search_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_started
      meilisearch:
        condition: service_healthy
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # XenoRun Code Execution Engine
  xenorun:
    build:
      context: ../xenorun
      dockerfile: Dockerfile
    container_name: xenostudio-xenorun
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LaTeX Compilation Service (Full TeX Live)
  latex:
    build:
      context: .
      dockerfile: Dockerfile.latex
    container_name: xenostudio-latex
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # NON-SECRET build args only — provider API keys are never baked into the
        # frontend image; all inference routes through the authed, metered backend.
        - VITE_API_URL=/api
        - VITE_WS_URL=wss://xenostudio.ai/ws
        - VITE_ENABLE_SITE_GATE=${VITE_ENABLE_SITE_GATE}
        - VITE_SITE_PASSWORD=${VITE_SITE_PASSWORD}
    container_name: xenostudio-frontend
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:8080
      - VITE_API_URL=/api
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "127.0.0.1:4040:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xenostudio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html && wget -qO- http://127.0.0.1/health >/dev/null && wget -qO- http://127.0.0.1/api/status >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Gateway (commented out - no Dockerfile)
